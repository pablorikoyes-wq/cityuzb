function openPicker() {
  const sheet = document.getElementById('wd-picker');
  document.getElementById('wd-picker-title').innerText = wdMethod === 'card' ? "To'lov tizimini tanlang" : 'Bankni tanlang';
  document.getElementById('wd-picker-list').innerHTML = providerList().map(pv => `
    <button class="wd-pick-row ${wdProvider === pv.id ? 'active' : ''}" onclick="selectProvider('${pv.id}')">
      ${pvLogo(pv)}<span class="wd-pick-name">${pv.name}</span><span class="wd-pick-check">✓</span>
    </button>`).join('');
  sheet.classList.add('show');
  haptic('light');
}
function closePicker() { document.getElementById('wd-picker')?.classList.remove('show'); }

function selectProvider(id) {
  wdProvider = id;
  renderProviders();
  closePicker();
  setWdError('provider', '');
  // подсказка в поле номера карты под выбранную систему: 9860 0000 0000 0000
  if (wdMethod === 'card') {
    const pv = findProvider('card', id);
    document.getElementById('wd-details').placeholder = pv.mask + ' 0000 0000 0000';
  }
  haptic('light');
}

function onWdDetailsInput(el) {
  let n = digits(el.value);
  if (wdMethod === 'card') {
    n = n.slice(0, 19);
    el.value = n.replace(/(\d{4})(?=\d)/g, '$1 ');
  } else {
    if (n.startsWith('998')) n = n.slice(3);
    n = n.slice(0, 9);
    const p = [n.slice(0, 2), n.slice(2, 5), n.slice(5, 7), n.slice(7, 9)].filter(Boolean);
    el.value = '+998' + (p.length ? ' ' + p.join(' ') : '');
  }
  setWdError('details', '');
}

function setWdError(field, msg) {
  const e = document.getElementById('wd-' + field + '-error');
  if (e) e.innerText = msg;
  const input = {amount: 'wd-amount', name: 'wd-name', details: 'wd-details'}[field];
  if (input) document.getElementById(input)?.parentElement.classList.toggle('bad', !!msg);
}

function fmtCard(d) { return d.replace(/(\d{4})(?=\d)/g, '$1 '); }
function fmtPhone(d) { return `+998 ${d.slice(0, 2)} ${d.slice(2, 5)} ${d.slice(5, 7)} ${d.slice(7, 9)}`; }

function wdNext() {
  const amount = parseInt(digits(document.getElementById('wd-amount').value) || '0', 10);
  const name = (document.getElementById('wd-name').value || '').trim().replace(/\s+/g, ' ');
  let details = digits(document.getElementById('wd-details').value);
  if (wdMethod === 'phone' && details.startsWith('998')) details = details.slice(3);
  let ok = true;

  if (!amount || amount < WITHDRAW_MIN) {
    setWdError('amount', `Minimal yechish summasi — ${formatNum(WITHDRAW_MIN)} so'm`); ok = false;
  } else if (amount > user.balance) {
    setWdError('amount', `Balansingizda yetarli mablag' yo'q (${formatNum(user.balance)} so'm)`); ok = false;
  }
  if (name.split(' ').length < 2 || name.length < 5 || /[0-9]/.test(name)) {
    setWdError('name', "Ism va familiyani to'liq kiriting"); ok = false;
  }
  const pv = wdProvider ? findProvider(wdMethod, wdProvider) : null;
  if (!pv) {
    setWdError('provider', wdMethod === 'card' ? "To'lov tizimini tanlang" : 'Bankni tanlang'); ok = false;
  }
  if (wdMethod === 'card') {
    const lens = pv ? pv.len : [16];
    if (!lens.includes(details.length)) { setWdError('details', `Karta raqami ${lens[0]} ta raqamdan iborat bo'lishi kerak`); ok = false; }
  } else if (details.length !== 9) {
    setWdError('details', "Telefon raqamini to'liq kiriting: +998 XX XXX XX XX"); ok = false;
  }
  if (!ok) { haptic('error'); return; }

  wdPending = {amount, name, method: wdMethod, provider: pv.id, details};
  document.getElementById('wd-summary').innerHTML = wdSummaryHtml(wdPending);
  showScreen('withdraw-sponsors');
}

function wdSummaryHtml(p) {
  const pv = findProvider(p.method, p.provider);
  return `
    <div class="wd-row"><div class="wd-row-k">Summa</div><div class="wd-row-v big">${formatNum(p.amount)} so'm</div></div>
    <div class="wd-row"><div class="wd-row-k">Qabul qiluvchi</div><div class="wd-row-v">${escapeHtml(p.name)}</div></div>
    <div class="wd-row"><div class="wd-row-k">Usul</div><div class="wd-row-v">${p.method === 'card' ? '💳 Karta orqali' : '📱 Telefon orqali'}</div></div>
    <div class="wd-row"><div class="wd-row-k">${p.method === 'card' ? "To'lov tizimi" : 'Bank'}</div><div class="wd-row-v">${pv ? pvLogo(pv, true) + pv.name : ''}</div></div>
    <div class="wd-row"><div class="wd-row-k">${p.method === 'card' ? 'Karta raqami' : 'Telefon'}</div><div class="wd-row-v big">${p.method === 'card' ? fmtCard(p.details) : fmtPhone(p.details)}</div></div>`;
}

function escapeHtml(t) { return t.replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c])); }

function renderWithdrawSponsors() {
  const list = document.getElementById('wd-sponsors-list');
  if (!list) return;
  list.innerHTML = channels.map(ch => `
    <div class="sponsor-card" onclick="openChannel('${ch.url}')">
      <div class="sp-icon">${ch.avatar ? `<img src="${ch.avatar}" alt="">` : '📢'}</div>
      <div class="sp-info"><div class="sp-name">${ch.name}</div></div>
      <div class="sp-action">Obuna</div>
    </div>
  `).join('');
}

async function wdCheckAndSubmit() {
  if (!wdPending) { showScreen('withdraw'); return; }
  const btn = document.getElementById('wd-check-btn');
  btn.disabled = true;
  btn.innerText = 'Tekshirilmoqda...';
  try {
    // 1) проверка подписки
    const subRes = await fetch(`${API_URL}/api/check_subscription`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({init_data: initData})
    });
    const sub = await subRes.json();
    if (!sub.subscribed) {
      toast("❌ Obuna bo'ling: " + (sub.not_subscribed || []).join(', '));
      return;
    }
    // 2) заявка на вывод — сервер проверяет баланс и сохраняет заявку
    const res = await fetch(`${API_URL}/api/withdraw`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        init_data: initData,
        amount: wdPending.amount,
        recipient_name: wdPending.name,
        method: wdPending.method,                      // 'card' или 'phone'
        provider: wdPending.provider,                  // uzcard/humo/visa/... или банк: uzum/tbc/...
        details: wdPending.method === 'phone' ? '998' + wdPending.details : wdPending.details
      })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      toast('❌ ' + (data.error || "So'rovni yuborib bo'lmadi. Keyinroq urinib ko'ring"));
      return;
    }
    // сервер принял заявку — списываем сумму и показываем подтверждение
    user.balance = typeof data.balance === 'number' ? data.balance : user.balance - wdPending.amount;
    saveProgress();
    document.getElementById('wd-done-summary').innerHTML = wdSummaryHtml(wdPending);
    wdPending = null;
    haptic('success');
    showScreen('withdraw-done');
  } catch (e) {
    toast("❌ Server bilan aloqa yo'q. Keyinroq urinib ko'ring");
  } finally {
    btn.disabled = false;
    btn.innerText = 'Obunani tekshirish';
  }
}

function showReferral() {
  const link = `https://t.me/YOUR_BOT?start=ref_${user.user_id}`;
  if (tg) {
    tg.showAlert("🎁 Do'stlaringizni taklif qiling!\n\nSizning havolangiz:\n" + link);
  } else {
    alert('Referral: ' + link);
  }
}

function showLeaderboard() {
  toast('Tez kunda!');
}

// СТАРТ
// ============================================================
init();
</script>
