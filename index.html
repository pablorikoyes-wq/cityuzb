<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CityUz — Qurilish Ustasi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --color-bg:#e8eef5;
  --color-bg-soft:#f5f8fc;
  --color-primary:#4a90e2;
  --color-primary-dark:#357abd;
  --color-primary-soft:#5b9fe8;
  --color-primary-light:#6ab2f2;
  --color-primary-bg:#e8f0ff;
  --color-success:#4caf50;
  --color-success-dark:#43a047;
  --color-gold:#f5b301;
  --color-text:#1a2b42;
  --color-text-soft:#7a8ba3;
  --color-text-faint:#8a9bb5;
  --color-border:#c5cfdc;
  --color-divider:#f0f3f8;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px;
  --radius-sm:10px; --radius-md:14px; --radius-lg:16px; --radius-xl:20px; --radius-full:999px;
  --shadow-sm:0 2px 6px rgba(26,43,66,.06);
  --shadow-md:0 4px 14px rgba(26,43,66,.08),0 1px 2px rgba(26,43,66,.04);
  --shadow-lg:0 10px 28px rgba(26,43,66,.12);
  --shadow-glow-blue:0 10px 22px rgba(74,144,226,.35),0 2px 6px rgba(74,144,226,.25);
  --shadow-glow-green:0 10px 22px rgba(76,175,80,.35),0 2px 6px rgba(76,175,80,.25);
  --shadow-glow-gold:0 8px 18px rgba(245,179,1,.3);
  --ease-out:cubic-bezier(.16,1,.3,1);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:var(--color-bg);overflow:hidden;user-select:none}
.app{width:100%;max-width:500px;height:100vh;margin:0 auto;background:
  radial-gradient(circle at 1px 1px,rgba(74,144,226,.08) 1px,transparent 0) 0 0/22px 22px,
  linear-gradient(180deg,#eef3fa,var(--color-bg) 220px);
  position:relative;display:flex;flex-direction:column;overflow:hidden}
.screen{display:none;flex-direction:column;height:100%;overflow-y:auto;padding-bottom:92px;opacity:0;transform:translateY(8px);transition:opacity .3s var(--ease-out),transform .3s var(--ease-out)}
.screen.active{display:flex}
.screen.active.in{opacity:1;transform:translateY(0)}
#screen-main{padding-bottom:16px}

/* ОКНА (карточки-секции) */
.window{margin:8px 16px;border-radius:var(--radius-lg);position:relative;overflow:hidden}

/* ПЛАШКА №1 — самая верхняя тонкая полоска (бренд + баланс) */
.top-strip{margin:8px 16px 0;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-sm)}
.brand-row{display:flex;align-items:center;gap:7px}
.brand-row .brand-mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--color-primary),var(--color-primary-dark));display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:var(--shadow-glow-blue)}
.brand-row .brand-word{font-size:14px;font-weight:800;color:var(--color-primary-dark);letter-spacing:.3px}
.balance-badge{background:var(--color-bg-soft);border-radius:var(--radius-full);padding:6px 13px;display:flex;align-items:center;gap:6px}
.balance-badge .coin{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;filter:drop-shadow(0 1px 1px rgba(245,179,1,.4))}
.balance-badge .amount{font-weight:800;font-size:14px;color:var(--color-text)}

/* ОКНО 2 — заголовок-приветствие */
/* СТРАНИЦА-ПОДЛОЖКА (та же ширина, что и окно городов — края идут вровень) */
.hero-page{margin:8px 16px 0;background:linear-gradient(135deg,var(--color-primary-soft),var(--color-primary-dark));padding:16px 16px 44px;color:#fff;position:relative;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.hero-page h2{font-size:16px;font-weight:800;margin-bottom:4px}
.hero-page p{font-size:12px;opacity:.9}

/* ОКНО 3 — список городов, "страница поверх страницы": наезжает на подложку сверху, края вровень с ней */
.window-cities{background:#fff;padding:14px 14px 16px;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.7)}
.window-cities .section-title{padding:0 0 10px}
.sheet-page{margin-top:-26px;position:relative;z-index:2}

/* ИКОНОЧНЫЕ СЛОТЫ (сюда позже вставляются собственные картинки) */
.icon-slot{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.16);border:1.5px dashed rgba(255,255,255,.45);border-radius:var(--radius-md);color:#fff}

/* CITIES */
.section-title{padding:16px 16px 8px;font-size:15px;font-weight:800;color:var(--color-text)}
.cities-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.city-card{background:#fff;border-radius:var(--radius-md);padding:8px;text-align:center;cursor:pointer;transition:transform .18s var(--ease-out),box-shadow .18s var(--ease-out);box-shadow:var(--shadow-sm);position:relative;border:1px solid rgba(255,255,255,.8)}
.city-card:active{transform:scale(.95);box-shadow:var(--shadow-sm)}
.city-card:not(.locked):hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.city-card.locked{opacity:.6}
.icon-slot-city{width:100%;height:80px;border-radius:10px;margin-bottom:0;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;position:relative}
.icon-slot-city img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.city-label-row{position:absolute;top:4px;left:4px;right:4px;display:flex;align-items:center;gap:4px;z-index:2;min-width:0}
.city-num{flex:none;background:var(--color-primary);color:#fff;width:16px;height:16px;border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(74,144,226,.5)}
.city-name{flex:1;min-width:0;font-size:10px;font-weight:800;color:#fff;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,30,50,.55)}
.city-img{background:linear-gradient(150deg,#a9e0f5,#87ceeb 60%,#6bc4ea);box-shadow:inset 0 -6px 10px rgba(0,60,90,.12)}
.city-diff{position:absolute;left:0;right:0;bottom:0;height:9px;border-radius:0 0 9px 9px;margin:0}
.diff-easy{background:#4caf50}
.diff-medium{background:#f5b301}
.diff-hard{background:#ff8a3d}
.diff-extreme{background:#f44336}
.lock-icon{position:absolute;top:4px;right:4px;font-size:14px}
.city-card.locked::after{content:'🔒';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px}

/* ВИТРИНА: 10-й город (Tashkent City) — крупная карточка в самом низу, надпись по центру */
.city-showcase-card{margin:10px 0 0;height:120px;position:relative;border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;box-shadow:var(--shadow-lg);transition:transform .18s var(--ease-out)}
.city-showcase-card:active{transform:scale(.98)}
.city-showcase-card .showcase-img{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(150deg,#5b7fae,#2f4d78 60%,#1a2b42)}
.city-showcase-card .showcase-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.city-showcase-card .showcase-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;gap:2px;background:linear-gradient(180deg,rgba(10,20,35,.15),rgba(10,20,35,.72))}
.city-showcase-card .showcase-lock-center{font-size:20px;margin-bottom:2px}
.city-showcase-card .showcase-name-center{font-size:16px;font-weight:800;color:#fff}
.city-showcase-card .showcase-sub-center{font-size:11px;color:rgba(255,255,255,.8);font-weight:600}
.city-showcase-card.locked .showcase-img{filter:grayscale(.35);opacity:.85}

/* PROGRESS */
.xp-bar{margin:8px 16px;background:#fff;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.xp-bar .label{font-size:11px;color:var(--color-text-soft);font-weight:600}
.xp-bar .bar{flex:1;height:8px;background:var(--color-bg);border-radius:4px;overflow:hidden}
.xp-bar .fill{height:100%;background:linear-gradient(90deg,var(--color-primary),var(--color-primary-light));border-radius:4px;transition:width .3s}
.xp-bar .value{font-size:11px;font-weight:700;color:var(--color-text)}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;gap:10px;padding:12px 0 18px;max-width:500px;margin:0 auto;box-shadow:0 -2px 10px rgba(26,43,66,.05);z-index:100}
.nav-bar-inline{display:flex;justify-content:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--color-divider)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 18px;cursor:pointer;color:var(--color-text-faint);font-size:11px;font-weight:600;border:none;background:none;transition:color .2s,transform .2s}
.nav-btn.active{color:var(--color-primary);transform:translateY(-1px)}
.nav-btn .icon{display:flex;align-items:center;justify-content:center;transition:transform .2s}
.nav-btn.active .icon{transform:scale(1.12)}

/* GAME SCREEN */
.game-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.back-btn{background:#fff;border:none;color:var(--color-primary);cursor:pointer;font-weight:700;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
.back-btn:active{transform:scale(.92)}
.game-title{font-size:16px;font-weight:800;color:var(--color-text)}
.stats-row{padding:8px 16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat-box{background:#fff;border-radius:var(--radius-md);padding:8px;text-align:center;box-shadow:var(--shadow-sm);border:1px solid rgba(255,255,255,.7)}
.stat-box .label{font-size:10px;color:var(--color-text-soft);font-weight:600;margin-bottom:2px}
.stat-box .value{font-size:15px;font-weight:800;color:var(--color-text)}
.stat-box .value.gold{color:var(--color-gold)}
.hearts{padding:0 16px;display:flex;gap:4px;align-items:center}
.heart{font-size:20px}
.wind-badge{margin:8px 16px;background:#fff;border-radius:10px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-text-soft);font-weight:600}
.game-canvas-wrap{margin:8px 16px;flex:1;position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#87ceeb,#b0e0f5);min-height:280px}
.game-canvas-wrap canvas{display:block;width:100%;height:100%;touch-action:none}
.build-btn{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#5fce63,var(--color-success) 50%,var(--color-success-dark));color:#fff;border:none;border-radius:var(--radius-full);padding:14px 60px;font-size:18px;font-weight:900;letter-spacing:1px;box-shadow:var(--shadow-glow-green),inset 0 1px 1px rgba(255,255,255,.4);cursor:pointer;transition:transform .15s var(--ease-out),box-shadow .15s var(--ease-out)}
.build-btn:active{transform:translateX(-50%) scale(.95);box-shadow:0 4px 10px rgba(76,175,80,.35)}
.result-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:20px 40px;border-radius:20px;text-align:center;display:none;z-index:10}
.result-overlay.show{display:block;animation:pop .3s}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.result-text{font-size:32px;font-weight:900;margin-bottom:8px}
.result-perfect{color:var(--color-success)}
.result-good{color:#ffc107}
.result-bad{color:#ff9800}
.result-miss{color:#f44336}

/* PROFILE */
.profile-header{padding:20px 16px;display:flex;align-items:center;gap:14px;background:#fff;margin:8px 16px;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);border:1px solid rgba(255,255,255,.7)}
.profile-avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--color-primary),var(--color-primary-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px}
.profile-info .name{font-size:17px;font-weight:800;color:var(--color-text);margin-bottom:2px}
.profile-info .id{font-size:12px;color:var(--color-text-soft);margin-bottom:4px}
.profile-info .level-badge{background:var(--color-primary-bg);color:var(--color-primary);font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;display:inline-block}

.balance-card{margin:8px 16px;background:linear-gradient(135deg,var(--color-primary-light),var(--color-primary) 50%,var(--color-primary-dark));border-radius:var(--radius-lg);padding:16px;display:flex;justify-content:space-between;align-items:center;color:#fff;box-shadow:var(--shadow-glow-blue);position:relative;overflow:hidden}
.balance-card::before{content:'';position:absolute;top:-30px;left:-30px;width:100px;height:100px;background:rgba(255,255,255,.12);border-radius:50%}
.balance-card .amount{font-size:22px;font-weight:900;margin-top:2px;position:relative}
.balance-card .label{font-size:11px;opacity:.85;position:relative}

.menu-list{margin:8px 16px;background:#fff;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-md);border:1px solid rgba(255,255,255,.7)}
.menu-item{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--color-divider);cursor:pointer;font-size:14px;font-weight:600;color:var(--color-text)}
.menu-item:last-child{border-bottom:none}
.menu-item:active{background:var(--color-bg-soft)}
.menu-item .icon{font-size:20px}
.menu-item .arrow{margin-left:auto;color:var(--color-border);font-size:16px}
.menu-item .badge{background:var(--color-success);color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;margin-left:auto}

/* STATS SCREEN */
.stats-main{margin:8px 16px;background:#fff;border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-md);border:1px solid rgba(255,255,255,.7)}
.stats-main .label{font-size:12px;color:var(--color-text-soft);margin-bottom:4px;font-weight:600}
.stats-main .value{font-size:26px;font-weight:900;color:var(--color-text)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 16px}
.stats-grid .stat-item{background:#fff;border-radius:var(--radius-md);padding:14px;box-shadow:var(--shadow-sm);text-align:center;border:1px solid rgba(255,255,255,.7);transition:transform .15s var(--ease-out)}
.stats-grid .stat-item:active{transform:scale(.97)}
.stats-grid .stat-item .emoji{font-size:26px;margin-bottom:6px}
.stats-grid .stat-item .num{font-size:20px;font-weight:900;color:var(--color-text)}
.stats-grid .stat-item .label{font-size:11px;color:var(--color-text-soft);margin-top:2px;font-weight:600}
.best-results{margin:8px 16px;background:#fff;border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-md);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;border:1px solid rgba(255,255,255,.7)}
.best-results .best-item .emoji{font-size:22px;margin-bottom:4px}
.best-results .best-item .num{font-size:14px;font-weight:800;color:var(--color-text)}
.best-results .best-item .label{font-size:10px;color:var(--color-text-soft);margin-top:2px}

/* SOVRINLAR */
.achievement{margin:8px 16px;background:#fff;border-radius:var(--radius-lg);padding:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm);border:1px solid rgba(255,255,255,.7);transition:transform .15s var(--ease-out)}
.achievement:not(.locked):active{transform:scale(.98)}
.achievement.locked{opacity:.5}
.achievement .ach-icon{width:48px;height:48px;border-radius:50%;background:linear-gradient(150deg,#ffe469,#ffd700 45%,var(--color-gold));display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;box-shadow:var(--shadow-glow-gold),inset 0 1px 1px rgba(255,255,255,.5)}
.achievement.locked .ach-icon{background:var(--color-bg)}
.achievement .ach-info{flex:1}
.achievement .ach-name{font-size:14px;font-weight:700;color:var(--color-text);margin-bottom:2px}
.achievement .ach-desc{font-size:11px;color:var(--color-text-soft)}
.achievement .ach-progress{font-size:11px;font-weight:700;color:var(--color-primary);margin-top:2px}

/* BONUS (было "вывод") */
.bonus-hint{font-size:13px;text-align:center;color:var(--color-text-soft);font-weight:600;padding:8px 16px 16px}
.bonus-submit{width:100%;background:var(--color-primary);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;margin-top:4px}

/* SPONSORS */
.sponsor-card{margin:8px 16px;background:#fff;border-radius:var(--radius-md);padding:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .15s var(--ease-out),box-shadow .15s var(--ease-out)}
.sponsor-card:active{transform:scale(.98);box-shadow:var(--shadow-sm)}
.sponsor-card .sp-icon{width:44px;height:44px;border-radius:50%;background:linear-gradient(150deg,var(--color-primary-bg),#dbe9ff);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.sponsor-card .sp-info{flex:1}
.sponsor-card .sp-name{font-size:14px;font-weight:700;color:var(--color-text)}
.sponsor-card .sp-action{background:linear-gradient(135deg,var(--color-primary-light),var(--color-primary-dark));color:#fff;padding:8px 16px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;box-shadow:0 3px 8px rgba(74,144,226,.35)}
.sponsor-card.checked .sp-action{background:linear-gradient(135deg,#5fce63,var(--color-success-dark));box-shadow:0 3px 8px rgba(76,175,80,.35)}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:rgba(0,0,0,.85);color:#fff;padding:12px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;transition:transform .3s;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

/* LOADING / SKELETON */
.loading{display:flex;flex-direction:column;align-items:center;height:100vh;padding-top:64px;color:var(--color-text-soft);font-weight:600}
.brand-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:36px}
.brand-logo .brand-icon{width:60px;height:60px;border-radius:var(--radius-lg);background:linear-gradient(150deg,var(--color-primary-light),var(--color-primary) 55%,var(--color-primary-dark));display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:var(--shadow-glow-blue),inset 0 1px 1px rgba(255,255,255,.4);animation:brandPulse 1.8s ease-in-out infinite}
.brand-logo .brand-name{font-size:20px;font-weight:900;color:var(--color-text);letter-spacing:.4px}
.brand-logo .brand-sub{font-size:11px;color:var(--color-text-soft);font-weight:600}
@keyframes brandPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.skeleton{width:100%;max-width:500px;padding:0 16px}
.sk{position:relative;overflow:hidden;background:#e4ebf3;border-radius:var(--radius-md)}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:shimmer 1.4s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}
.sk-banner{height:78px;border-radius:var(--radius-lg);margin-bottom:10px}
.sk-bar{height:14px;width:45%;margin:0 0 14px;border-radius:var(--radius-sm)}
.sk-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sk-tile{height:78px}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="loading" id="loading">
    <div class="brand-logo">
      <div class="brand-icon">🏗️</div>
      <div class="brand-name">CityUz</div>
      <div class="brand-sub">Qurilish Ustasi yuklanmoqda…</div>
    </div>
    <div class="skeleton">
      <div class="sk sk-banner"></div>
      <div class="sk sk-bar"></div>
      <div class="sk-grid">
        <div class="sk sk-tile"></div>
        <div class="sk sk-tile"></div>
        <div class="sk sk-tile"></div>
        <div class="sk sk-tile"></div>
        <div class="sk sk-tile"></div>
        <div class="sk sk-tile"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// КОНФИГ
// ============================================================
const API_URL = 'http://107-189-21-103.sslip.io:8081';
const BONUS_AMOUNT = 500; // монет за подписку на все каналы

// ============================================================
// SVG-ИКОНКИ (вместо части эмодзи — для чёткого/единого стиля)

function formatNum(n) {
  return (n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.innerText = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ============================================================
// ЭКРАНЫ
// ============================================================
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => { s.classList.remove('active'); s.classList.remove('in'); });
  const el = document.getElementById('screen-' + name);
  if (el) {
    el.classList.add('active');
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  }

  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const navMap = {main: 0, stats: 1, ach: 2, profile: 3};
  if (navMap[name] !== undefined) {
    document.querySelectorAll('.nav-bar').forEach(bar => {
      bar.querySelectorAll('.nav-btn')[navMap[name]]?.classList.add('active');
    });
  }

  // Фиксированное меню внизу нужно на всех экранах, КРОМЕ главного (там оно встроено в окно Shaharlar) и игры/бонуса
  const hideFixedNav = ['game', 'sponsors', 'main'].includes(name);
  document.getElementById('bottom-nav').style.display = hideFixedNav ? 'none' : 'flex';

  currentScreen = name;
}

let canvas, ctx, animId;
let crane = {x: 50, dir: 1, speed: 2};
let block = {x: 50, y: 20, width: 60, height: 30};
let tower = [];
let gameActive = false;
let lives = 3;
let floors = 0;
let goal = 10;
let earned = 0;
let currentCity = null;
let comboCount = 0;
let maxCombo = 0;
let perfectCount = 0;
let totalAttempts = 0;
let particles = [];
let frame = 0;

// Тематическая палитра блоков (голубой/золотой — в духе CityUz)
const BLOCK_PALETTE = [
  {top:'#7fc8f5', mid:'#5aa8e8', edge:'#3d7cc9'},
  {top:'#ffd873', mid:'#f5b301', edge:'#c98d00'},
  {top:'#8fe0c2', mid:'#4fbd93', edge:'#2f8f6c'},
];

function spawnBurst(x, y, colorHex, count) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const speed = 2 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      life: 1,
      color: colorHex,
      size: 2 + Math.random() * 2.5,
    });
  }
}

function updateParticles() {
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life -= 0.025;
  });
  particles = particles.filter(p => p.life > 0);
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function startGame(cityIndex) {
  currentCity = CITIES[cityIndex];
  lives = 3;
  floors = 0;
  earned = 0;
  tower = [];
  comboCount = 0;
  maxCombo = 0;
  perfectCount = 0;
  totalAttempts = 0;
  particles = [];
  frame = 0;
  gameActive = true;

  const diffMap = {easy: 1, medium: 1.5, hard: 2, extreme: 2.5};
  const diffMult = diffMap[currentCity.diff] || 1;
  crane.speed = 1.5 * diffMult;
  block.width = 70 - (diffMult * 10);

  goal = 10 + (cityIndex * 2);

  document.getElementById('game-city').innerText = currentCity.name;
  document.getElementById('stat-goal').innerText = goal;
  document.getElementById('stat-floors').innerText = 0;
  document.getElementById('stat-reward').innerText = 0;

  showScreen('game');

  setTimeout(() => {
    canvas = document.getElementById('game-canvas');
    const wrap = document.getElementById('canvas-wrap');
    canvas.width = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
    ctx = canvas.getContext('2d');

    tower.push({x: canvas.width/2 - 60, y: canvas.height - 80, width: 120, height: 40});

    gameLoop();
  }, 100);
}

function gameLoop() {
  if (!gameActive) return;
  frame++;

  crane.x += crane.dir * crane.speed;
  if (crane.x > canvas.width - 80 || crane.x < 20) {
    crane.dir *= -1;
  }

  updateParticles();
  draw();
  animId = requestAnimationFrame(gameLoop);
}

function draw() {
  if (!ctx) return;
  const w = canvas.width, h = canvas.height;

  // --- НЕБО ---
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#a9def0');
  sky.addColorStop(0.6, '#cdeaf7');
  sky.addColorStop(1, '#e8f6fb');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);

  // мягкое солнце
  const sunGrad = ctx.createRadialGradient(w - 46, 34, 2, w - 46, 34, 42);
  sunGrad.addColorStop(0, 'rgba(255,244,200,.95)');
  sunGrad.addColorStop(1, 'rgba(255,244,200,0)');
  ctx.fillStyle = sunGrad;
  ctx.beginPath(); ctx.arc(w - 46, 34, 42, 0, Math.PI*2); ctx.fill();

  // облака (мягкие, с лёгкой тенью снизу)
  drawCloud(50 + Math.sin(frame/160)*6, 36, 1);
  drawCloud(w - 130 + Math.cos(frame/190)*6, 58, 0.8);

  // --- ГОРИЗОНТ / ЗЕМЛЯ ---
  const groundY = h - 40;
  ctx.fillStyle = 'rgba(0,40,20,.10)';
  ctx.fillRect(0, groundY - 3, w, 3);
  const groundGrad = ctx.createLinearGradient(0, groundY, 0, h);
  groundGrad.addColorStop(0, '#9ed976');
  groundGrad.addColorStop(1, '#7cc158');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, groundY, w, 40);
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.lineWidth = 2;
  for (let gx = -((frame*0.3)%18); gx < w; gx += 18) {
    ctx.beginPath(); ctx.moveTo(gx, groundY + 6); ctx.lineTo(gx + 9, groundY + 6); ctx.stroke();
  }

  // --- БАШНЯ ---
  tower.forEach((b, i) => {
    drawBlock(b, i);
  });

  // --- КРАН ---
  drawCrane();

  // --- НЕСОМЫЙ БЛОК ---
  const bx = crane.x + 4 - block.width / 2;
  const carried = {x: bx, y: block.y, width: block.width, height: block.height};
  // тень-проекция на земле/башне (подсказка выравнивания)
  ctx.fillStyle = 'rgba(20,40,60,.10)';
  ctx.beginPath();
  ctx.ellipse(crane.x + 4, groundY - 2, block.width * 0.42, 5, 0, 0, Math.PI*2);
  ctx.fill();
  drawBlock(carried, tower.length, true);

  // --- ЧАСТИЦЫ (эффект PERFECT/GOOD) ---
  drawParticles();
}

function drawCloud(cx, cy, scale) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.fillStyle = 'rgba(20,60,90,.06)';
  ctx.beginPath();
  ctx.ellipse(0, 10, 40, 10, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(0, 0, 16, 0, Math.PI*2);
  ctx.arc(20, -4, 20, 0, Math.PI*2);
  ctx.arc(42, 0, 15, 0, Math.PI*2);
  ctx.arc(20, 8, 18, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawBlock(b, index, isCarried) {
  const pal = BLOCK_PALETTE[index % BLOCK_PALETTE.length];

  // тень под блоком
  ctx.fillStyle = 'rgba(20,30,50,.12)';
  ctx.fillRect(b.x + 3, b.y + b.height - 2, b.width, 5);

  const grad = ctx.createLinearGradient(0, b.y, 0, b.y + b.height);
  grad.addColorStop(0, pal.top);
  grad.addColorStop(1, pal.mid);
  ctx.fillStyle = grad;
  roundRect(b.x, b.y, b.width, b.height, 4);
  ctx.fill();

  // верхняя грань (объём/ledge)
  ctx.fillStyle = 'rgba(255,255,255,.45)';
  roundRect(b.x, b.y, b.width, Math.min(6, b.height * 0.28), 4);
  ctx.fill();

  // контур
  ctx.strokeStyle = pal.edge;
  ctx.lineWidth = 1.5;
  roundRect(b.x, b.y, b.width, b.height, 4);
  ctx.stroke();

  // окна
  ctx.fillStyle = isCarried ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.85)';
  const winSize = Math.max(6, b.width / 7);
  for (let wx = b.x + 8; wx < b.x + b.width - winSize; wx += winSize + 6) {
    ctx.fillRect(wx, b.y + b.height * 0.42, winSize * 0.7, b.height * 0.32);
  }

  if (isCarried) {
    // блик выделения на несомом блоке
    ctx.strokeStyle = 'rgba(255,255,255,.8)';
    ctx.lineWidth = 2;
    roundRect(b.x - 1, b.y - 1, b.width + 2, b.height + 2, 5);
    ctx.stroke();
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawCrane() {
  const railY = 30;
  const w = canvas.width;

  // рельс
  const railGrad = ctx.createLinearGradient(0, railY, 0, railY + 8);
  railGrad.addColorStop(0, '#6b7785');
  railGrad.addColorStop(1, '#454f5b');
  ctx.fillStyle = railGrad;
  ctx.fillRect(0, railY, w, 6);

  // решётчатая мачта (лёгкий узор)
  ctx.strokeStyle = 'rgba(70,80,95,.35)';
  ctx.lineWidth = 1.5;
  for (let x = 10; x < w; x += 24) {
    ctx.beginPath(); ctx.moveTo(x, railY + 6); ctx.lineTo(x + 12, railY + 12); ctx.stroke();
  }

  // кабина крана (тележка)
  ctx.fillStyle = '#f5b301';
  roundRect(crane.x - 10, railY - 10, 24, 14, 3);
  ctx.fill();
  ctx.strokeStyle = '#c98d00';
  ctx.lineWidth = 1.5;
  roundRect(crane.x - 10, railY - 10, 24, 14, 3);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fillRect(crane.x - 6, railY - 7, 8, 6);

  // трос
  ctx.strokeStyle = '#3a4048';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(crane.x + 4, railY + 8);
  ctx.lineTo(crane.x + 4, block.y);
  ctx.stroke();

  // крюк
  ctx.strokeStyle = '#3a4048';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(crane.x + 4, block.y - 3, 4, 0.2, Math.PI - 0.2);
  ctx.stroke();
}

function buildBlock() {
  if (!gameActive) return;

  totalAttempts++;
  const lastBlock = tower[tower.length - 1];
  const blockCenter = crane.x + 4;
  const lastCenter = lastBlock.x + lastBlock.width / 2;
  const diff = Math.abs(blockCenter - lastCenter);
  const tolerance = lastBlock.width / 2;

  let result, reward, color;
  if (diff < tolerance * 0.15) {
    result = 'PERFECT';
    reward = 200;
    color = 'perfect';
    comboCount++;
    perfectCount++;
  } else if (diff < tolerance * 0.5) {
    result = 'GOOD';
    reward = 100;
    color = 'good';
    comboCount++;
  } else if (diff < tolerance) {
    result = 'BAD';
    reward = 50;
    color = 'bad';
    comboCount = 0;
  } else {
    result = 'MISS';
    reward = 0;
    color = 'miss';
    lives--;
    comboCount = 0;
  }

  maxCombo = Math.max(maxCombo, comboCount);

  if (result === 'PERFECT') {
    spawnBurst(blockCenter, block.y + block.height / 2, '#f5b301', 16);
  } else if (result === 'GOOD') {
    spawnBurst(blockCenter, block.y + block.height / 2, '#6ab2f2', 8);
  }

  let mult = 1;
  if (comboCount >= 10) mult = 3;
  else if (comboCount >= 5) mult = 2;
  else if (comboCount >= 3) mult = 1.5;

  reward = Math.round(reward * mult);
  earned += reward;
  floors++;

  const overlay = document.getElementById('result-overlay');
  const text = document.getElementById('result-text');
  const rew = document.getElementById('result-reward');
  text.className = 'result-text result-' + color;
  text.innerText = result + (mult > 1 ? ` x${mult}` : '');
  rew.innerText = '+' + formatNum(reward) + ' tanga';
  overlay.classList.add('show');
  setTimeout(() => overlay.classList.remove('show'), 600);

  if (result !== 'MISS') {
    tower.push({
      x: lastBlock.x + (blockCenter - lastCenter) - block.width / 2,
      y: lastBlock.y - block.height,
      width: block.width,
      height: block.height
    });
  }

  document.getElementById('stat-floors').innerText = floors;
  document.getElementById('stat-reward').innerText = formatNum(earned);
  updateHearts();

  if (lives <= 0 || floors >= goal) {
    endGame();
  }
}

function updateHearts() {
  const el = document.getElementById('hearts');
  el.innerHTML = Array(3).fill(0).map((_, i) =>
    `<span class="heart">${i < lives ? '❤️' : '🖤'}</span>`
  ).join('');
}

async function endGame() {
  gameActive = false;
  cancelAnimationFrame(animId);

  const accuracy = totalAttempts > 0 ? (perfectCount / totalAttempts) * 100 : 0;

  user.balance += earned;
  user.total_games += 1;
  user.total_floors += floors;
  user.total_earned += earned;
  user.best_height = Math.max(user.best_height, floors);
  user.best_accuracy = Math.max(user.best_accuracy, accuracy);
  user.best_combo = Math.max(user.best_combo, maxCombo);

  try {
    const res = await fetch(`${API_URL}/api/save_game`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        init_data: initData,
        city: currentCity.name,
        floors: floors,
        accuracy: accuracy,
        combo: maxCombo,
        earned: earned
      })
    });
    const data = await res.json();
    if (data.user) {
      user = data.user;
    }
  } catch (e) {
    console.error('Save error:', e);
  }

  setTimeout(() => {
    toast(`🏗 ${floors} qavat | 🎯 ${Math.round(accuracy)}% | 🔥 x${maxCombo} | 🪙 +${formatNum(earned)} tanga`);
    setTimeout(() => {
      exitGame();
    }, 2500);
  }, 700);
}

function exitGame() {
  gameActive = false;
  cancelAnimationFrame(animId);
  render();
  showScreen('main');
}

function openBonus() {
  if (user.bonus_claimed) {
    toast("Bonus allaqachon olingan");
    return;
  }
  showScreen('sponsors');
}

function renderSponsors() {
  const list = document.getElementById('sponsors-list');
  if (!list) return;

  list.innerHTML = channels.map((ch, i) => `
    <div class="sponsor-card" onclick="window.open('${ch.url}', '_blank')">
      <div class="sp-icon">📢</div>
      <div class="sp-info">
        <div class="sp-name">${ch.name}</div>
      </div>
      <div class="sp-action">Obuna</div>
    </div>
  `).join('');
}

async function checkSubscription() {
  try {
    const res = await fetch(`${API_URL}/api/check_subscription`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({init_data: initData})
    });
    const data = await res.json();

    if (data.subscribed) {
      user.balance += BONUS_AMOUNT;
      user.bonus_claimed = true;
      toast(`✅ Bonus qoʻshildi: +${BONUS_AMOUNT} tanga`);
      render();
      showScreen('profile');
    } else {
      toast("❌ Obuna bo'ling: " + (data.not_subscribed || []).join(', '));
    }
  } catch (e) {
    toast('❌ Tarmoq xatosi');
  }
}

  const link = `https://t.me/YOUR_BOT?start=ref_${user.user_id}`;
  if (tg) {
    tg.showAlert("🎁 Do'stlaringizni taklif qiling!\n\nSizning havolangiz:\n" + link);
  } else {

  }
}

}
