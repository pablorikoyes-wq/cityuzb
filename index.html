<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CityUz — Qurilish Ustasi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --color-bg:#e8eef5;
  --color-bg-soft:#f5f8fc;
  --color-primary:#4a90e2;
  --color-primary-dark:#357abd;
  --color-primary-soft:#5b9fe8;
  --color-primary-light:#6ab2f2;
  --color-primary-bg:#e8f0ff;
  --color-success:#4caf50;
  --color-success-dark:#43a047;
  --color-gold:#f5b301;
  --color-text:#1a2b42;
  --color-text-soft:#7a8ba3;
  --color-text-faint:#8a9bb5;
  --color-border:#c5cfdc;
  --color-divider:#f0f3f8;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px;
  --radius-sm:10px; --radius-md:14px; --radius-lg:16px; --radius-xl:20px; --radius-full:999px;
  --shadow-sm:0 2px 6px rgba(26,43,66,.06);
  --shadow-md:0 4px 14px rgba(26,43,66,.08),0 1px 2px rgba(26,43,66,.04);
  --shadow-lg:0 10px 28px rgba(26,43,66,.12);
  --shadow-glow-blue:0 10px 22px rgba(74,144,226,.35),0 2px 6px rgba(74,144,226,.25);
  --shadow-glow-green:0 10px 22px rgba(76,175,80,.35),0 2px 6px rgba(76,175,80,.25);
  --shadow-glow-gold:0 8px 18px rgba(245,179,1,.3);
  --ease-out:cubic-bezier(.16,1,.3,1);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:var(--color-bg);overflow:hidden;user-select:none}
.app{width:100%;max-width:500px;height:100vh;margin:0 auto;background:
  radial-gradient(circle at 1px 1px,rgba(74,144,226,.08) 1px,transparent 0) 0 0/22px 22px,
  linear-gradient(180deg,#eef3fa,var(--color-bg) 220px);
  position:relative;display:flex;flex-direction:column;overflow:hidden}
.screen{display:none;flex-direction:column;height:100%;overflow-y:auto;padding-bottom:92px;opacity:0;transform:translateY(8px);transition:opacity .3s var(--ease-out),transform .3s var(--ease-out)}
.screen.active{display:flex}
.screen.active.in{opacity:1;transform:translateY(0)}
#screen-main{padding-bottom:8px;overflow-y:hidden}
#screen-main .window-cities.sheet-page{flex:1;display:flex;flex-direction:column;min-height:0}
.cities-scroll{flex:1;overflow-y:auto;min-height:0}

#screen-stats,#screen-ach,#screen-profile{padding-bottom:8px;overflow-y:hidden}

/* ОКНА (карточки-секции) */
.window{margin:8px 16px;border-radius:var(--radius-lg);position:relative;overflow:hidden}

/* ПЛАШКА №1 — самая верхняя тонкая полоска (бренд + баланс) */
.top-strip{margin:8px 16px 0;padding:8px 14px;min-height:44px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:var(--radius-lg) var(--radius-lg) 0 0;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;z-index:1}
.top-strip-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.top-strip::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.88));z-index:0}
.top-strip.has-image::after{background:linear-gradient(180deg,rgba(10,20,35,.05),rgba(10,20,35,.28))}
.brand-row{display:flex;align-items:center;gap:7px;position:relative;z-index:1}
.brand-row .brand-mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--color-primary),var(--color-primary-dark));display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:var(--shadow-glow-blue)}
.brand-row .brand-word{font-size:14px;font-weight:800;color:var(--color-primary-dark);letter-spacing:.3px}
.balance-badge{background:var(--color-bg-soft);border-radius:var(--radius-full);padding:6px 13px;display:flex;align-items:center;gap:6px;position:relative;z-index:1}
.balance-badge .coin{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;filter:drop-shadow(0 1px 1px rgba(245,179,1,.4))}
.balance-badge .amount{font-weight:800;font-size:14px;color:var(--color-text)}

/* СТРАНИЦА-ПОДЛОЖКА (баннер-приветствие) */
.hero-page{margin:-14px 16px 0;background:linear-gradient(135deg,var(--color-primary-soft),var(--color-primary-dark));padding:22px 16px 44px;min-height:117px;display:flex;flex-direction:column;justify-content:center;color:#fff;position:relative;overflow:hidden;border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:2}
.hero-page-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.hero-page::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(91,159,232,.72),rgba(53,122,189,.8));z-index:0}
.hero-page.has-image::after{background:linear-gradient(180deg,rgba(10,20,35,0),rgba(10,20,35,.22))}
.hero-page h2,.hero-page p{position:relative;z-index:1}
.hero-page h2{font-size:16px;font-weight:800;margin-bottom:4px}
.hero-page p{font-size:12px;opacity:.9}

/* ОКНО 3 — список городов */
.window-cities{background:#fff;padding:14px 14px 16px;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.7)}
.window-cities .section-title{padding:0 0 10px}
.sheet-page{margin-top:-26px;position:relative;z-index:3}

.icon-slot{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.16);border:1.5px dashed rgba(255,255,255,.45);border-radius:var(--radius-md);color:#fff}

/* CITIES */
.section-title{padding:16px 16px 8px;font-size:15px;font-weight:800;color:var(--color-text)}
.cities-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.city-card{background:#fff;border-radius:var(--radius-md);padding:8px;text-align:center;cursor:pointer;transition:transform .18s var(--ease-out),box-shadow .18s var(--ease-out);box-shadow:var(--shadow-sm);position:relative;border:1px solid rgba(255,255,255,.8)}
.city-card:active{transform:scale(.95);box-shadow:var(--shadow-sm)}
.city-card:not(.locked):hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.city-card.locked{opacity:.6}
.icon-slot-city{width:100%;height:80px;border-radius:10px;margin-bottom:0;display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;position:relative}
.icon-slot-city img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.city-label-row{position:absolute;top:4px;left:4px;right:4px;display:flex;align-items:center;gap:4px;z-index:2;min-width:0}
.city-num{flex:none;background:var(--color-primary);color:#fff;width:16px;height:16px;border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(74,144,226,.5)}
.city-name{flex:1;min-width:0;font-size:10px;font-weight:800;color:#fff;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,30,50,.55)}
.city-img{background:linear-gradient(150deg,#a9e0f5,#87ceeb 60%,#6bc4ea);box-shadow:inset 0 -6px 10px rgba(0,60,90,.12)}
.city-diff{position:absolute;left:0;right:0;bottom:0;height:9px;border-radius:0 0 9px 9px;margin:0}
.diff-easy{background:#4caf50}
.diff-medium{background:#f5b301}
.diff-hard{background:#ff8a3d}
.diff-extreme{background:#f44336}
.lock-icon{position:absolute;top:4px;right:4px;font-size:14px}
.city-card.locked::after{content:'🔒';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px}

/* ВИТРИНА: 10-й город */
.city-showcase-card{margin:10px 0 0;height:120px;position:relative;border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;box-shadow:var(--shadow-lg);transition:transform .18s var(--ease-out)}
.city-showcase-card:active{transform:scale(.98)}
.city-showcase-card .showcase-img{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(150deg,#5b7fae,#2f4d78 60%,#1a2b42)}
.city-showcase-card .showcase-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.city-showcase-card .showcase-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;gap:2px;background:linear-gradient(180deg,rgba(10,20,35,.15),rgba(10,20,35,.72))}
.city-showcase-card .showcase-lock-center{font-size:20px;margin-bottom:2px}
.city-showcase-card .showcase-name-center{font-size:16px;font-weight:800;color:#fff}
.city-showcase-card .showcase-sub-center{font-size:11px;color:rgba(255,255,255,.8);font-weight:600}
.city-showcase-card.locked .showcase-img{filter:grayscale(.35);opacity:.85}

/* НИЖНЕЕ МЕНЮ */
.nav-bar-inline{display:flex;justify-content:center;gap:10px;flex:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--color-divider)}
.section-body .nav-bar-inline{margin:12px 16px 0;padding-bottom:16px}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 18px;cursor:pointer;color:var(--color-text-faint);font-size:11px;font-weight:600;border:none;background:none;transition:color .2s,transform .2s}
.nav-btn.active{color:var(--color-primary);transform:translateY(-1px)}
.nav-btn .icon{display:flex;align-items:center;justify-content:center;transition:transform .2s}
.nav-btn.active .icon{transform:scale(1.12)}

/* ШАПКА-ОКНО ОСТАЛЬНЫХ ЭКРАНОВ */
.section-hero{margin:8px 16px 0;background:linear-gradient(180deg,rgb(12,45,86),rgb(27,55,95));padding:22px 16px 40px;color:#fff;position:relative;overflow:hidden;border-radius:var(--radius-lg) var(--radius-lg) 0 0;flex:none}
.section-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.section-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,45,86,.25),rgba(27,55,95,.35));z-index:0}
.section-hero h2{position:relative;z-index:1;font-size:24px;font-weight:900;letter-spacing:.2px}
.section-body{flex:1;min-height:0;margin:-26px 16px 0;padding:22px 0 0;background:#fff;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.7);border-radius:var(--radius-lg);position:relative;z-index:2;display:flex;flex-direction:column}
.section-scroll{flex:1;min-height:0;overflow-y:auto}

/* Шапка для экрана бонуса */
.game-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.back-btn{background:#fff;border:none;color:var(--color-primary);cursor:pointer;font-weight:700;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)}
.back-btn:active{transform:scale(.92)}
.game-title{font-size:16px;font-weight:800;color:var(--color-text)}

/* PROFILE */
.profile-header{padding:20px 16px;display:flex;align-items:center;gap:14px;background:#fff;margin:8px 16px;border-radius:var(--radius-lg);box-shadow:var(--shadow-md);border:1px solid rgba(255,255,255,.7)}
.profile-avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--color-primary),var(--color-primary-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px}
.profile-info .name{font-size:17px;font-weight:800;color:var(--color-text);margin-bottom:2px}
.profile-info .id{font-size:12px;color:var(--color-text-soft);margin-bottom:4px}
.profile-info .level-badge{background:var(--color-primary-bg);color:var(--color-primary);font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;display:inline-block}

.balance-card{margin:8px 16px;background:linear-gradient(135deg,var(--color-primary-light),var(--color-primary) 50%,var(--color-primary-dark));border-radius:var(--radius-lg);padding:16px;display:flex;justify-content:space-between;align-items:center;color:#fff;box-shadow:var(--shadow-glow-blue);position:relative;overflow:hidden}
.balance-card::before{content:'';position:absolute;top:-30px;left:-30px;width:100px;height:100px;background:rgba(255,255,255,.12);border-radius:50%}
.balance-card .amount{font-size:22px;font-weight:900;margin-top:2px;position:relative}
.balance-card .label{font-size:11px;opacity:.85;position:relative}

.menu-list{margin:8px 16px;background:#fff;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-md);border:1px solid rgba(255,255,255,.7)}
.menu-item{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--color-divider);cursor:pointer;font-size:14px;font-weight:600;color:var(--color-text)}
.menu-item:last-child{border-bottom:none}
.menu-item:active{background:var(--color-bg-soft)}
.menu-item .icon{font-size:20px}
.menu-item .arrow{margin-left:auto;color:var(--color-border);font-size:16px}
.menu-item .badge{background:var(--color-success);color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;margin-left:auto}

/* STATS SCREEN */
.stats-main{margin:8px 16px;background:#fff;border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-md);border:1px solid rgba(255,255,255,.7)}
.stats-main .label{font-size:12px;color:var(--color-text-soft);margin-bottom:4px;font-weight:600}
.stats-main .value{font-size:26px;font-weight:900;color:var(--color-text)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 16px}
.stats-grid .stat-item{background:#fff;border-radius:var(--radius-md);padding:14px;box-shadow:var(--shadow-sm);text-align:center;border:1px solid rgba(255,255,255,.7);transition:transform .15s var(--ease-out)}
.stats-grid .stat-item:active{transform:scale(.97)}
.stats-grid .stat-item .emoji{font-size:26px;margin-bottom:6px}
.stats-grid .stat-item .num{font-size:20px;font-weight:900;color:var(--color-text)}
.stats-grid .stat-item .label{font-size:11px;color:var(--color-text-soft);margin-top:2px;font-weight:600}
.best-results{margin:8px 16px;background:#fff;border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-md);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;border:1px solid rgba(255,255,255,.7)}
.best-results .best-item .emoji{font-size:22px;margin-bottom:4px}
.best-results .best-item .num{font-size:14px;font-weight:800;color:var(--color-text)}
.best-results .best-item .label{font-size:10px;color:var(--color-text-soft);margin-top:2px}

/* SOVRINLAR */
.achievement{margin:8px 16px;background:#fff;border-radius:var(--radius-lg);padding:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm);border:1px solid rgba(255,255,255,.7);transition:transform .15s var(--ease-out)}
.achievement:not(.locked):active{transform:scale(.98)}
.achievement.locked{opacity:.5}
.achievement .ach-icon{width:48px;height:48px;border-radius:50%;background:linear-gradient(150deg,#ffe469,#ffd700 45%,var(--color-gold));display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;box-shadow:var(--shadow-glow-gold),inset 0 1px 1px rgba(255,255,255,.5)}
.achievement.locked .ach-icon{background:var(--color-bg)}
.achievement .ach-info{flex:1}
.achievement .ach-name{font-size:14px;font-weight:700;color:var(--color-text);margin-bottom:2px}
.achievement .ach-desc{font-size:11px;color:var(--color-text-soft)}
.achievement .ach-progress{font-size:11px;font-weight:700;color:var(--color-primary);margin-top:2px}

/* BONUS */
.bonus-hint{font-size:13px;text-align:center;color:var(--color-text-soft);font-weight:600;padding:8px 16px 16px}
.bonus-submit{width:100%;background:var(--color-primary);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;margin-top:4px}

/* SPONSORS */
.sponsor-card{margin:8px 16px;background:#fff;border-radius:var(--radius-md);padding:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .15s var(--ease-out),box-shadow .15s var(--ease-out)}
.sponsor-card:active{transform:scale(.98);box-shadow:var(--shadow-sm)}
.sponsor-card .sp-icon{width:44px;height:44px;border-radius:50%;background:linear-gradient(150deg,var(--color-primary-bg),#dbe9ff);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.sponsor-card .sp-info{flex:1}
.sponsor-card .sp-name{font-size:14px;font-weight:700;color:var(--color-text)}
.sponsor-card .sp-action{background:linear-gradient(135deg,var(--color-primary-light),var(--color-primary-dark));color:#fff;padding:8px 16px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;box-shadow:0 3px 8px rgba(74,144,226,.35)}
.sponsor-card.checked .sp-action{background:linear-gradient(135deg,#5fce63,var(--color-success-dark));box-shadow:0 3px 8px rgba(76,175,80,.35)}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:rgba(0,0,0,.85);color:#fff;padding:12px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;transition:transform .3s;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

/* LOADING / SKELETON */
.loading{display:flex;flex-direction:column;align-items:center;height:100vh;padding-top:64px;color:var(--color-text-soft);font-weight:600}
.brand-logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:36px}
.brand-logo .brand-icon{width:60px;height:60px;border-radius:var(--radius-lg);background:linear-gradient(150deg,var(--color-primary-light),var(--color-primary) 55%,var(--color-primary-dark));display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:var(--shadow-glow-blue),inset 0 1px 1px rgba(255,255,255,.4);animation:brandPulse 1.8s ease-in-out infinite}
.brand-logo .brand-name{font-size:20px;font-weight:900;color:var(--color-text);letter-spacing:.4px}
.brand-logo .brand-sub{font-size:11px;color:var(--color-text-soft);font-weight:600}
@keyframes brandPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.skeleton{width:100%;max-width:500px;padding:0 16px}
.sk{position:relative;overflow:hidden;background:#e4ebf3;border-radius:var(--radius-md)}
.sk::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:shimmer 1.4s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}
.sk-banner{height:78px;border-radius:var(--radius-lg);margin-bottom:10px}
.sk-bar{height:14px;width:45%;margin:0 0 14px;border-radius:var(--radius-sm)}
.sk-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sk-tile{height:78px}

/* ================= ПРАВКИ ВЁРСТКИ v2 ================= */
.app{height:var(--tg-viewport-stable-height,100dvh)}
#screen-main,#screen-stats,#screen-ach,#screen-profile{
  padding-bottom:calc(12px + var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));
  overflow-y:hidden;
}
.top-strip{min-height:58px}
.top-strip.has-image .brand-row{display:none}
.hero-page{border-radius:0}
#screen-main .window-cities.sheet-page{margin-bottom:0;padding:14px 14px 0}
.cities-scroll{display:flex;flex-direction:column}
.cities-grid{flex:1 0 auto;grid-auto-rows:minmax(96px,1fr)}
.city-card{display:flex}
.icon-slot-city{height:auto;min-height:80px;flex:1}
.city-showcase-card{flex:0 0 auto;height:clamp(120px,18vh,170px)}
.nav-bar-inline,
.section-body .nav-bar-inline{
  display:grid;grid-template-columns:repeat(4,1fr);gap:0;
  margin:10px 14px 0;padding:10px 0 12px;
  border-top:1px solid var(--color-divider);flex:none;
}
.window-cities .nav-bar-inline{margin:10px 0 0}
.nav-btn{padding:6px 2px;white-space:nowrap;min-width:0}
.nav-btn .icon svg{width:26px;height:26px}

/* ================= ПРАВКИ v3 ================= */
.top-strip{justify-content:flex-end;align-items:flex-start;padding-top:8px}
.screen,.screen.active,.screen.active.in{opacity:1;transform:none;transition:none}
@keyframes tabContentIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.screen.active .cities-scroll,
.screen.active .section-scroll,
.screen.active .section-hero h2{animation:tabContentIn .25s cubic-bezier(.16,1,.3,1) both}
.nav-btn{transition:color .25s ease}
.nav-btn .icon{transition:transform .25s ease}

/* ======================= ИГРА (v4) ======================= */
#screen-game{padding:0;overflow:hidden;position:relative}
.game-canvas-wrap{position:absolute;top:6px;left:6px;right:6px;bottom:calc(6px + var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)));border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#87ceeb,#b0e0f5);box-shadow:var(--shadow-lg)}
.game-canvas-wrap canvas{display:block;width:100%;height:100%;touch-action:none}

/* Верхняя компактная панель поверх поля */
.game-hud-top{position:absolute;top:10px;left:10px;right:10px;z-index:5;display:flex;align-items:center;gap:8px}
.hud-back{flex:none;width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.88);color:var(--color-primary);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hud-back:active{transform:scale(.92)}
.hud-pill{background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12);color:var(--color-text)}
.hud-title{flex:1;min-width:0;padding:5px 12px;text-align:center;line-height:1.2}
.hud-city{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-floors{font-size:11px;font-weight:700;color:var(--color-text-soft)}
.hud-floors b{color:var(--color-text)}
.hud-combo{flex:none;padding:9px 12px;font-size:13px;font-weight:900;opacity:.6;transition:opacity .2s,background .2s,transform .2s}
.hud-combo.active{opacity:1;background:linear-gradient(135deg,#ffe07a,#f5b301);color:#4a2c00;transform:scale(1.05)}

/* Правая колонка: выигрыш + результаты */
.hud-right{position:absolute;right:10px;top:50%;z-index:4;display:flex;flex-direction:column;align-items:flex-end;gap:5px;pointer-events:none;transition:opacity .2s}
.hud-right.dim{opacity:.3}
.hud-win{min-width:76px;padding:6px 10px;border-radius:12px;background:linear-gradient(135deg,#ffe07a,#f5b301 55%,#e39a00);color:#3f2500;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.18);border:1.5px solid rgba(255,255,255,.7)}
.hud-win-label{font-size:10px;font-weight:800;opacity:.75;text-transform:uppercase;letter-spacing:.5px}
.hud-win-value{font-size:17px;font-weight:900}
.hud-win.bump{animation:hudBump .35s var(--ease-out)}
@keyframes hudBump{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.hud-results-title{margin-top:4px;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.hud-results{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.hud-chip{min-width:54px;text-align:center;padding:3px 8px;border-radius:8px;font-size:11px;font-weight:800;color:#fff;background:rgba(15,35,65,.55);border:1px solid rgba(255,255,255,.45)}
.hud-chip:first-child{animation:chipIn .3s var(--ease-out)}
.hud-chip.perfect{color:#ffe27a;border-color:#ffd54a}
.hud-chip:nth-child(n+4){opacity:.7}
@keyframes chipIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}

/* Надпись результата каждого броска */
.result-pop{position:absolute;left:0;right:0;top:30%;z-index:6;text-align:center;pointer-events:none;opacity:0}
.result-pop.show{animation:resultPop .9s var(--ease-out) forwards}
@keyframes resultPop{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.1)}30%{transform:scale(1)}70%{opacity:1;transform:translateY(-6px)}100%{opacity:0;transform:translateY(-24px)}}
.rp-text{display:inline-block;font-size:30px;font-weight:900;letter-spacing:1px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.3)}
.rp-perfect{color:#ffd54a}.rp-good{color:#9be15d}.rp-bad{color:#ffb74d}.rp-miss{color:#ff5a4f}

/* Кнопка QURISH в стиле стройки */
.build-btn{position:absolute;left:16px;right:16px;bottom:14px;z-index:5;border:3px solid #26282c;border-radius:16px;padding:17px 0 15px;overflow:hidden;background:linear-gradient(180deg,#ffdc55,#f5b301 55%,#e29c00);color:#3a2600;font-size:20px;font-weight:900;letter-spacing:3px;cursor:pointer;box-shadow:0 6px 0 #a86f00,0 12px 22px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s,filter .2s}
.build-btn::before,.build-btn::after{content:'';position:absolute;left:0;right:0;height:6px;background:repeating-linear-gradient(-45deg,#26282c 0 8px,transparent 8px 16px)}
.build-btn::before{top:0}
.build-btn::after{bottom:0}
.build-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a86f00,0 6px 12px rgba(0,0,0,.25)}
.build-btn:disabled{filter:saturate(.7) brightness(.95);cursor:default}

/* Окно конца игры */
.game-over{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(8,16,30,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.game-over.show{display:flex;animation:goFade .25s ease}
@keyframes goFade{from{opacity:0}to{opacity:1}}
.go-card{position:relative;width:100%;max-width:320px;padding:44px 18px 16px;border-radius:22px;background:linear-gradient(180deg,#30343f,#1b1e26);border:2px solid #e6b64a;color:#fff;text-align:center;box-shadow:0 20px 44px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);animation:goCard .45s var(--ease-out)}
@keyframes goCard{from{transform:translateY(20px) scale(.92);opacity:0}to{transform:none;opacity:1}}
.go-icon{position:absolute;top:-34px;left:50%;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe98f,#f5b301 60%,#c98300);display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 0 0 4px #1b1e26,0 0 26px rgba(245,179,1,.55)}
.go-sub{font-size:13px;font-weight:600;opacity:.7}

.go-amount small{font-size:15px;font-weight:800;opacity:.85}

.go-btn.primary{background:linear-gradient(180deg,#ffdc55,#f5b301);color:#3a2600;box-shadow:0 4px 0 #a86f00}
.go-btn:active{transform:translateY(2px)}
</style>
</head>

function toast(msg) {

  document.querySelectorAll('.screen').forEach(s => { s.classList.remove('active'); s.classList.remove('in'); });

  if (el) {
    el.classList.add('active');

const GAME_BG_PARALLAX = 0.25;         // скорость фона: меньше число = город виден дольше (0.25 ≈ 10–15 этажей)
const TOWER_TOP_SCREEN_FRACTION = 0.56;// на какой высоте поля держится верх башни (камера)
const BLOCK_WIDTH_FRACTION = 0.30;     // ширина этажа от ширины поля
const JIB_Y = 76;                      // высота стрелы крана от верха поля
const DROP_GAP = 110;                  // расстояние от низа висящего домика до верха башни
const SLING_HEIGHT = 22;               // длина строп от крюка до домика
const GRAVITY = 2600;                  // сила падения домика (px/сек²)
const RELEASE_VX_FACTOR = 0.35;        // насколько раскачка "бросает" домик вбок при отпускании
const MAGNET_STRENGTH = 0.15;          // лёгкое притяжение к центру (0 = без помощи)
const PENDULUM_G = 2600;               // "жёсткость" маятника (больше = быстрее качается)
const PENDULUM_DAMPING = 1.4;          // затухание раскачки
const PENDULUM_MAX_ANGLE = 0.32;       // максимальный наклон домика на тросе (~18°)
const SPAWN_DELAY_MS = 320;            // пауза перед появлением следующего домика
// Награды за один домик (умножаются на комбо-бонус)
const REWARDS = {perfect: 200, good: 100, bad: 30};
// Надписи при попадании (узбекский)
const RESULT_LABELS = {perfect: 'MUKAMMAL!', good: 'YAXSHI!', bad: 'ARANG!', miss: 'YIQILDI!'};
// Сложность городов: ширина домика и скорость крана
const DIFF = {
  easy:    {width: 1.00, speed: 1.5},
  medium:  {width: 0.93, speed: 1.8},
  hard:    {width: 0.86, speed: 2.0},
  extreme: {width: 0.80, speed: 2.2},
};
// Виды этажей (рисуются кодом) и их высота относительно обычной
const FLOOR_STYLES = ['plaster', 'brick', 'wood', 'round', 'panel', 'arch'];
const FLOOR_HEIGHT_MULT = {plaster: 1, brick: 0.92, wood: 0.82, round: 0.95, panel: 0.88, arch: 1.05};

// СВОИ КАРТИНКИ ЭТАЖЕЙ — если вставить сюда ссылки, этажи будут выбираться из них
// случайно вместо нарисованных кодом. Пусто — рисуются 6 видов домиков кодом.
const FLOOR_IMAGES = [
  '',
  '',
];
const floorImgObjs = FLOOR_IMAGES.map(url => {
  if (!url) return null;
  const img = new Image();
  img.ready = false;
  img.onload = () => { img.ready = true; };
  img.src = url;
  return img;
});

// Размеры крюка
const HOOK_BLOCK_H = 22;
const HOOK_TOTAL = 36;

// ---------- СОСТОЯНИЕ ----------
let canvas, ctx, animId, lastTime = 0;
let W = 0, H = 0, groundY = 0;
let blockW = 100, baseH = 80;
let crane = {x: 0, v: 0, phase: 0, omega: 1.5, amp: 100, theta: 0, thetaV: 0, cable: 100};
let load = null;          // домик, висящий на крюке
let holding = false;
let spawnAt = 0;
let tower = [];
let fallingBlock = null;
let gameActive = false;   // крутится ли анимация
let playing = false;      // можно ли нажимать QURISH
let finished = false;
let isDropping = false;
let floors = 0, goal = 10, earned = 0;
let currentCity = null, currentCityIndex = 0;
let comboCount = 0, maxCombo = 0, perfectCount = 0, totalAttempts = 0, accSum = 0;
let particles = [], floatTexts = [], resultsHistory = [];
let frame = 0;
let worldOffset = 0, worldOffsetTarget = 0;
let landingSquash = 0;
let lastStyle = null;

// Физика падения, если домик не удержался на краю
const WOBBLE_DURATION_MS = 350;
const WOBBLE_MAX_ANGLE = 0.16;
const TOPPLE_MAX_DURATION_MS = 3000;
const TOPPLE_GRAVITY = 6;
const TOPPLE_SEED_ANGVEL = 0.6;
const TOPPLE_MAX_TIP_ANGLE = 0.75;
const TOPPLE_FALL_GRAVITY = 1500;

function haptic(type) {
  try {
    const h = tg?.HapticFeedback;
    if (!h) return;
    if (type === 'success' || type === 'error' || type === 'warning') h.notificationOccurred(type);
    else h.impactOccurred(type);
  } catch (e) {}
}

function startGame(cityIndex) {
  cancelAnimationFrame(animId);
  currentCityIndex = cityIndex;
  currentCity = CITIES[cityIndex];
  floors = 0; earned = 0; tower = [];
  comboCount = 0; maxCombo = 0; perfectCount = 0; totalAttempts = 0; accSum = 0;
  particles = []; floatTexts = []; clouds = []; resultsHistory = [];
  worldOffset = 0; worldOffsetTarget = 0;
  fallingBlock = null; landingSquash = 0; lastStyle = null;
  load = null; holding = false; spawnAt = 0;
  isDropping = true; playing = false; finished = false; gameActive = true;
  goal = 10 + cityIndex * 2;

  document.getElementById('game-city').innerText = currentCity.name;
  document.getElementById('game-over').classList.remove('show');
  updateHud();
  renderResults();
  showScreen('game');

  // ждём, пока экран реально отрисуется, чтобы узнать размеры поля
  requestAnimationFrame(() => requestAnimationFrame(setupCanvas));
}

function setupCanvas() {
  canvas = document.getElementById('game-canvas');
  const wrap = document.getElementById('canvas-wrap');
  W = wrap.clientWidth;
  H = wrap.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 3); // чёткая картинка на iPhone
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  canvas.onpointerdown = () => buildBlock(); // можно тапать и по самому полю

  groundY = H - GAME_GROUND_OFFSET;
  const d = DIFF[currentCity.diff] || DIFF.easy;
  blockW = Math.max(70, Math.min(150, W * BLOCK_WIDTH_FRACTION * d.width));
  baseH = blockW * 0.8;

  // ФУНДАМЕНТ — всегда первый, чуть шире этажей
  const fw = blockW * 1.15, fh = baseH * 0.5;
  tower.push({x: W / 2 - fw / 2, drawX: W / 2 - fw / 2, y: groundY - fh, width: fw, height: fh, style: 'foundation'});

  crane.amp = W * 0.27;
  crane.omega = d.speed;
  crane.phase = 0; crane.theta = 0; crane.thetaV = 0;
  crane.x = W / 2; crane.v = 0;
  crane.cable = targetCable();

  playing = true;
  spawnLoad();
  lastTime = performance.now();
  animId = requestAnimationFrame(gameLoop);
}

function pickStyle() {
  const readyImgs = floorImgObjs.map((img, i) => (img && img.ready) ? i : -1).filter(i => i >= 0);
  if (readyImgs.length) return {style: 'img', imgIdx: readyImgs[Math.floor(Math.random() * readyImgs.length)]};
  let s;
  do { s = FLOOR_STYLES[Math.floor(Math.random() * FLOOR_STYLES.length)]; } while (s === lastStyle && FLOOR_STYLES.length > 1);
  lastStyle = s;
  return {style: s, imgIdx: -1};
}

function spawnLoad() {
  if (!playing) return;
  const p = pickStyle();
  load = {
    style: p.style, imgIdx: p.imgIdx,
    width: blockW,
    height: Math.round(baseH * (FLOOR_HEIGHT_MULT[p.style] || 1)),
    alpha: 0
  };
  holding = true;
  isDropping = false;
  const btn = document.getElementById('build-btn');
  if (btn) btn.disabled = false;
}

// Длина троса: кран опускает домик так, чтобы до верха башни всегда было DROP_GAP
function targetCable() {
  const top = tower[tower.length - 1];
  const topScreen = top ? top.y + worldOffsetTarget : H * TOWER_TOP_SCREEN_FRACTION;
  const lh = load ? load.height : baseH;
  return Math.max(40, topScreen - DROP_GAP - lh - SLING_HEIGHT - HOOK_TOTAL - (JIB_Y + 8));
}

function pendLen() {
  return crane.cable + ((holding && load) ? HOOK_TOTAL + SLING_HEIGHT + load.height / 2 : HOOK_TOTAL * 0.6);
}

// Кран: тележка ездит по стреле, а домик качается под ней как настоящий маятник —
// отстаёт на разгоне и догоняет на торможении
function updateCrane(dt) {
  crane.phase += crane.omega * dt;
  const s = Math.sin(crane.phase), c = Math.cos(crane.phase);
  crane.x = W / 2 + crane.amp * s;
  crane.v = crane.amp * crane.omega * c;
  const a = -crane.amp * crane.omega * crane.omega * s;
  const L = pendLen();
  const acc = -(PENDULUM_G / L) * Math.sin(crane.theta) - (a / L) * Math.cos(crane.theta) - PENDULUM_DAMPING * crane.thetaV;
  crane.thetaV += acc * dt;
  crane.theta += crane.thetaV * dt;
  if (Math.abs(crane.theta) > PENDULUM_MAX_ANGLE) {
    crane.theta = Math.sign(crane.theta) * PENDULUM_MAX_ANGLE;
    crane.thetaV *= -0.3;
  }
}

function hookPos() {
  const L = crane.cable;
  return {x: crane.x + L * Math.sin(crane.theta), y: JIB_Y + 8 + L * Math.cos(crane.theta)};
}

function gameLoop(now) {
  if (!gameActive) return;
  const dt = Math.min(0.033, Math.max(0, (now - lastTime) / 1000));
  lastTime = now;
  frame++;

  crane.cable += (targetCable() - crane.cable) * Math.min(1, dt * 4);
  updateCrane(dt);
  if (load && load.alpha < 1) load.alpha = Math.min(1, load.alpha + dt * 5);
  updateFalling(dt, now);
  if (!holding && !fallingBlock && spawnAt && now >= spawnAt) { spawnAt = 0; spawnLoad(); }
  updateParticles(dt);
  updateFloatTexts(dt);
  landingSquash *= Math.exp(-dt * 12);
  if (landingSquash < 0.01) landingSquash = 0;
  tower.forEach(b => { if (b.drawX !== b.x) b.drawX += (b.x - b.drawX) * Math.min(1, dt * 14); });
  worldOffset += (worldOffsetTarget - worldOffset) * Math.min(1, dt * 5);

  draw();
  dimHudIfCovered();
  animId = requestAnimationFrame(gameLoop);
}

// Правая колонка становится полупрозрачной, когда за ней пролетает домик
let hudRightEl = null, hudDim = false;
function dimHudIfCovered() {
  if (!hudRightEl || !hudRightEl.isConnected) hudRightEl = document.querySelector('.hud-right');
  if (!hudRightEl) return;
  let box = null;
  if (holding && load) {
    const hk = hookPos(), d = HOOK_TOTAL + SLING_HEIGHT + load.height / 2;
    const cx = hk.x + d * Math.sin(crane.theta), cy = hk.y + d * Math.cos(crane.theta);
    box = {l: cx - load.width / 2, r: cx + load.width / 2, t: cy - load.height / 2, b: cy + load.height / 2};
  } else if (fallingBlock && fallingBlock.phase !== 'wobble' && fallingBlock.phase !== 'topple') {
    const f = fallingBlock;
    box = {l: f.x, r: f.x + f.w, t: f.y, b: f.y + f.h};
  }
  let cover = false;
  if (box) {
    const l = hudRightEl.offsetLeft, t = hudRightEl.offsetTop;
    cover = box.r > l && box.l < l + hudRightEl.offsetWidth && box.b > t && box.t < t + hudRightEl.offsetHeight;
  }
  if (cover !== hudDim) { hudDim = cover; hudRightEl.classList.toggle('dim', cover); }
}

// Отпускаем домик: он сохраняет скорость раскачки и падает с ускорением (гравитация)
function buildBlock() {
  if (!playing || !holding || isDropping || !load) return;
  isDropping = true;
  holding = false;
  const btn = document.getElementById('build-btn');
  if (btn) btn.disabled = true;

  const hk = hookPos();
  const th = crane.theta;
  const d = HOOK_TOTAL + SLING_HEIGHT + load.height / 2;
  const cx = hk.x + d * Math.sin(th);
  const cy = hk.y + d * Math.cos(th);
  const Lp = crane.cable + d;
  const vx = crane.v + Lp * crane.thetaV * Math.cos(th);
  const vy = -Lp * crane.thetaV * Math.sin(th);

  fallingBlock = {
    phase: 'fall',
    x: cx - load.width / 2, y: cy - load.height / 2,
    w: load.width, h: load.height,
    style: load.style, imgIdx: load.imgIdx,
    vx: vx * RELEASE_VX_FACTOR, vy: Math.max(0, vy * 0.5),
    rot: -th
  };
  load = null;
  haptic('light');
}

function updateFalling(dt, now) {
  const fb = fallingBlock;
  if (!fb) return;

  if (fb.phase === 'fall' || fb.phase === 'pass') {
    fb.vy += GRAVITY * dt;
    fb.x += fb.vx * dt;
    fb.y += fb.vy * dt;
    if (fb.phase === 'fall') {
      fb.rot *= Math.exp(-dt * 9); // выравнивается в полёте
      const top = tower[tower.length - 1];
      const topY = top.y + worldOffset;
      if (fb.y + fb.h >= topY) {
        fb.y = topY - fb.h;
        resolveContact(fb, top, topY, now);
      }
    } else {
      fb.rot += fb.dir * 2.5 * dt;
      if (fb.y > H + fb.h) { fallingBlock = null; gameOver(false); }
    }
  } else if (fb.phase === 'wobble') {
    const t = Math.min(1, (now - fb.wobbleStart) / WOBBLE_DURATION_MS);
    fb.rotation = Math.sin(t * Math.PI * 6) * WOBBLE_MAX_ANGLE * t;
    if (t >= 1) {
      fb.phase = 'topple'; fb.sub = 'tip'; fb.toppleStart = now;
      fb.angle = 0; fb.angVel = TOPPLE_SEED_ANGVEL; fb.fallVel = 0; fb.rotation = 0;
    }
  } else if (fb.phase === 'topple') {
    if (fb.sub === 'tip') {
      fb.angVel += TOPPLE_GRAVITY * Math.sin(fb.angle + 0.08) * dt;
      fb.angle += fb.angVel * dt;
      if (fb.angle >= TOPPLE_MAX_TIP_ANGLE) { fb.angle = TOPPLE_MAX_TIP_ANGLE; fb.sub = 'fall'; }
    } else {
      fb.fallVel += TOPPLE_FALL_GRAVITY * dt;
      fb.pivotDY += fb.fallVel * dt;
      fb.pivotDX += fb.dir * 40 * dt;
      fb.angle += fb.angVel * dt;
    }
    fb.rotation = fb.dir * fb.angle;
    if (fb.pivotDY > H + fb.h || now - fb.toppleStart > TOPPLE_MAX_DURATION_MS) {
      fallingBlock = null;
      gameOver(false);
    }
  }
}

// Домик коснулся верха башни — решаем, устоял или нет
function resolveContact(fb, top, topY, now) {
  totalAttempts++;
  const lastCenter = top.x + top.width / 2;
  let cx = fb.x + fb.w / 2;
  const rawDiff = Math.abs(cx - lastCenter);
  const tol = top.width / 2;

  // Совсем мимо — пролетает сбоку от башни
  if (rawDiff >= (top.width + fb.w) / 2 - 1) {
    fb.phase = 'pass';
    fb.dir = cx >= lastCenter ? 1 : -1;
    registerResult('miss', 0, 1);
    return;
  }

  if (rawDiff < tol) cx += (lastCenter - cx) * MAGNET_STRENGTH;
  const diff = Math.abs(cx - lastCenter);
  const res = diff < tol * 0.15 ? 'perfect' : diff < tol * 0.5 ? 'good' : diff < tol ? 'bad' : 'miss';

  if (res === 'miss') {
    // Центр тяжести за краем — шатается и падает с башни
    registerResult('miss', 0, 1);
    fb.dir = cx >= lastCenter ? 1 : -1;
    fb.phase = 'wobble';
    fb.wobbleStart = now;
    fb.pivotX = fb.dir > 0 ? top.x + top.width : top.x;
    fb.pivotY = topY;
    fb.restX = fb.x; fb.restY = fb.y;
    fb.pivotDX = 0; fb.pivotDY = 0; fb.rotation = 0;
    spawnBurst(cx, topY, 'rgba(120,100,80,.7)', 8);
    return;
  }

  // Устоял
  accSum += Math.max(0, 1 - diff / tol);
  if (res === 'perfect') { comboCount++; perfectCount++; }
  else if (res === 'good') comboCount++;
  else comboCount = 0;
  maxCombo = Math.max(maxCombo, comboCount);
  const mult = getComboMult(comboCount);
  const reward = Math.round(REWARDS[res] * mult);
  earned += reward;
  floors++;

  const nb = {x: cx - fb.w / 2, drawX: fb.x, y: top.y - fb.h, width: fb.w, height: fb.h, style: fb.style, imgIdx: fb.imgIdx};
  tower.push(nb);
  fallingBlock = null;
  landingSquash = 1;
  worldOffsetTarget = Math.max(0, H * TOWER_TOP_SCREEN_FRACTION - nb.y);

  spawnBurst(cx, topY, 'rgba(140,120,95,.8)', 10);
  if (res === 'perfect') spawnBurst(cx, topY - fb.h / 2, '#f5b301', 16);
  floatTexts.push({x: cx, y: topY - fb.h - 10, text: '+' + formatNum(reward), life: 1, color: res === 'perfect' ? '#ffd54a' : '#ffffff'});

  registerResult(res, reward, mult);

  if (floors >= goal) {
    playing = false;
    setTimeout(() => gameOver(true), 600);
  } else {
    spawnAt = now + SPAWN_DELAY_MS;
  }
}

function registerResult(res, reward, mult) {
  if (res === 'miss') {
    comboCount = 0;
    playing = false;       // одна попытка: промах = конец игры
    haptic('error');
  } else {
    haptic(res === 'perfect' ? 'heavy' : 'medium');
    resultsHistory.unshift({res, reward});
    resultsHistory = resultsHistory.slice(0, 5);
    renderResults();
    const win = document.getElementById('hud-win');
    if (win) { win.classList.remove('bump'); void win.offsetWidth; win.classList.add('bump'); }
  }
  showResultPop(res, mult);
  updateHud();
}

function fmtMult(m) { return Number.isInteger(m) ? String(m) : m.toFixed(1); }

function showResultPop(res, mult) {
  const pop = document.getElementById('result-pop');
  const t = document.getElementById('rp-text');
  if (!pop || !t) return;
  t.className = 'rp-text rp-' + res;
  t.innerText = RESULT_LABELS[res] + (res !== 'miss' && mult > 1 ? ' x' + fmtMult(mult) : '');
  pop.classList.remove('show');
  void pop.offsetWidth;
  pop.classList.add('show');
}

function updateHud() {
  const f = document.getElementById('stat-floors'); if (f) f.innerText = floors;
  const g = document.getElementById('stat-goal'); if (g) g.innerText = goal;
  const e = document.getElementById('hud-earned'); if (e) e.innerText = formatNum(earned);
  const mult = getComboMult(comboCount);
  const ct = document.getElementById('combo-text'); if (ct) ct.innerText = 'x' + fmtMult(mult);
  const cb = document.getElementById('combo-badge'); if (cb) cb.classList.toggle('active', mult > 1);
}

function renderResults() {
  const el = document.getElementById('hud-results');
  if (!el) return;
  el.innerHTML = resultsHistory.map(r => `<div class="hud-chip ${r.res}">+${formatNum(r.reward)}</div>`).join('');
}

// Комбо-бонус за серию точных попаданий подряд
function getComboMult(combo) {
  if (combo >= 10) return 3;
  if (combo >= 5) return 2;
  if (combo >= 3) return 1.5;
  return 1;
}

// ---------- ЧАСТИЦЫ И ВСПЛЫВАЮЩИЕ ЦИФРЫ ----------
function spawnBurst(x, y, colorHex, count) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const speed = 2 + Math.random() * 3;
    particles.push({x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2, life: 1, color: colorHex, size: 2 + Math.random() * 2.5});
  }
}
function updateParticles(dt) {
  const k = dt * 60;
  particles.forEach(p => { p.x += p.vx * k; p.y += p.vy * k; p.vy += 0.15 * k; p.life -= 0.025 * k; });
  particles = particles.filter(p => p.life > 0);
}
function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}
function updateFloatTexts(dt) {
  floatTexts.forEach(t => { t.y -= 38 * dt; t.life -= dt * 0.9; });
  floatTexts = floatTexts.filter(t => t.life > 0);
}
function drawFloatTexts() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
  floatTexts.forEach(t => {
    ctx.globalAlpha = Math.min(1, t.life * 1.5);
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(30,20,0,.55)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  });
  ctx.globalAlpha = 1;
}

// ---------- ОТРИСОВКА КАДРА ----------
function draw() {
  if (!ctx) return;
  ctx.clearRect(0, 0, W, H);
  drawBackground();

  // Башня едет вместе с камерой
  ctx.save();
  ctx.translate(0, worldOffset);
  ctx.fillStyle = 'rgba(0,30,20,.16)';
  ctx.fillRect(0, groundY - 2, W, 2);
  tower.forEach((b, i) => {
    const sy = b.y + worldOffset;
    if (sy > H + 10 || sy + b.height < -10) return; // за экраном не рисуем
    const bb = {x: b.drawX, y: b.y, width: b.width, height: b.height};
    if (i === tower.length - 1 && i > 0 && landingSquash > 0.01) {
      const cx = bb.x + bb.width / 2, cy = bb.y + bb.height;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(1 + landingSquash * 0.1, 1 - landingSquash * 0.18);
      ctx.translate(-cx, -cy);
      drawFloor(bb, b.style, b.imgIdx);
      ctx.restore();
    } else {
      drawFloor(bb, b.style, b.imgIdx);
    }
  });
  ctx.restore();

  drawFallingBlock();
  drawCrane();
  drawParticles();
  drawFloatTexts();
}

function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#a9def0');
  sky.addColorStop(0.6, '#cdeaf7');
  sky.addColorStop(1, '#e8f6fb');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  if (gameBgReady && gameBgImg) {
    const bgH = H * GAME_BG_HEIGHT_MULT;
    const bgY = (groundY - GAME_BG_GROUND_FRACTION * bgH) + worldOffset * GAME_BG_PARALLAX;
    if (bgY < H) ctx.drawImage(gameBgImg, 0, bgY, W, bgH);
    if (gameSkyReady && gameSkyImg) {
      for (let i = 1; i <= GAME_SKY_MAX_TILES; i++) {
        const ty = bgY - i * bgH;
        if (ty > H || ty + bgH < 0) continue;
        ctx.drawImage(gameSkyImg, 0, ty, W, bgH);
      }
    }
    drawClouds(bgY);
  } else {
    const sunGrad = ctx.createRadialGradient(W - 46, 110, 2, W - 46, 110, 42);
    sunGrad.addColorStop(0, 'rgba(255,244,200,.95)');
    sunGrad.addColorStop(1, 'rgba(255,244,200,0)');
    ctx.fillStyle = sunGrad;
    ctx.beginPath(); ctx.arc(W - 46, 110, 42, 0, Math.PI * 2); ctx.fill();
    const cp = worldOffset * GAME_BG_PARALLAX;
    drawCloud(50 + Math.sin(frame / 160) * 6, 130 + cp, 1);
    drawCloud(W - 130 + Math.cos(frame / 190) * 6, 170 + cp, 0.8);
    ctx.fillStyle = '#8fd06a';
    ctx.fillRect(0, groundY + worldOffset, W, H);
  }
}

function drawClouds(bgY) {
  const skyBottom = Math.min(bgY, H);
  if (skyBottom > 20 && clouds.length < CLOUD_MAX_ON_SCREEN && Math.random() < CLOUD_SPAWN_CHANCE_PER_FRAME) {
    const readyIdxs = [];
    for (let i = 0; i < cloudImgs.length; i++) if (cloudImgs[i].ready) readyIdxs.push(i);
    if (readyIdxs.length) {
      const img = cloudImgs[readyIdxs[Math.floor(Math.random() * readyIdxs.length)]];
      const cw = CLOUD_WIDTH_MIN + Math.random() * (CLOUD_WIDTH_MAX - CLOUD_WIDTH_MIN);
      const ch = cw * ((img.naturalHeight || 60) / (img.naturalWidth || 110));
      const fromLeft = Math.random() < 0.5;
      const speed = CLOUD_SPEED_MIN + Math.random() * (CLOUD_SPEED_MAX - CLOUD_SPEED_MIN);
      const spawnY = Math.random() * Math.max(10, skyBottom - ch);
      clouds.push({img, x: fromLeft ? -cw : W + cw, vx: fromLeft ? speed : -speed, w: cw, h: ch, bgOffset: bgY - spawnY});
    }
  }
  for (let i = clouds.length - 1; i >= 0; i--) {
    const c = clouds[i];
    c.x += c.vx;
    if (c.x < -c.w - 20 || c.x > W + c.w + 20) { clouds.splice(i, 1); continue; }
    if (c.img.ready) ctx.drawImage(c.img, c.x, bgY - c.bgOffset, c.w, c.h);
  }
}

function drawCloud(cx, cy, scale) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(0, 0, 16, 0, Math.PI * 2);
  ctx.arc(20, -4, 20, 0, Math.PI * 2);
  ctx.arc(42, 0, 15, 0, Math.PI * 2);
  ctx.arc(20, 8, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawFallingBlock() {
  const fb = fallingBlock;
  if (!fb) return;
  const b = {x: 0, y: 0, width: fb.w, height: fb.h};
  ctx.save();
  if (fb.phase === 'fall' || fb.phase === 'pass') {
    const cx = fb.x + fb.w / 2, cy = fb.y + fb.h / 2;
    ctx.translate(cx, cy);
    ctx.rotate(fb.rot);
    b.x = -fb.w / 2; b.y = -fb.h / 2;
  } else {
    ctx.translate(fb.pivotX + fb.pivotDX, fb.pivotY + fb.pivotDY);
    ctx.rotate(fb.rotation || 0);
    ctx.translate(-fb.pivotX, -fb.pivotY);
    b.x = fb.restX; b.y = fb.restY;
  }
  drawFloor(b, fb.style, fb.imgIdx);
  ctx.restore();
}

// ---------- БАШЕННЫЙ КРАН ----------
function drawCrane() {
  const jy = JIB_Y;
  // оттяжки стрелы — уходят вверх к оголовку крана
  ctx.strokeStyle = 'rgba(55,60,70,.5)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(W * 0.2, jy - 16); ctx.lineTo(W * 0.06, -40);
  ctx.moveTo(W * 0.62, jy - 16); ctx.lineTo(W * 0.06, -40);
  ctx.stroke();

  drawJib(jy);
  drawCab(W * 0.06, jy);

  // тележка на стреле
  const tx = crane.x;
  ctx.fillStyle = '#3b4250';
  roundRect(tx - 15, jy - 2, 30, 10, 2);
  ctx.fill();
  ctx.fillStyle = '#1e232b';
  [tx - 9, tx + 9].forEach(wx => { ctx.beginPath(); ctx.arc(wx, jy - 2, 2.6, 0, Math.PI * 2); ctx.fill(); });

  // двойной трос до крюка
  const hk = hookPos();
  const px = Math.cos(crane.theta) * 3, py = -Math.sin(crane.theta) * 3;
  ctx.strokeStyle = '#2b3037';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(tx - 3, jy + 8); ctx.lineTo(hk.x - px, hk.y - py);
  ctx.moveTo(tx + 3, jy + 8); ctx.lineTo(hk.x + px, hk.y + py);
  ctx.stroke();

  // крюк + домик на стропах (всё поворачивается вместе с тросом)
  ctx.save();
  ctx.translate(hk.x, hk.y);
  ctx.rotate(-crane.theta);
  drawHookBlock();
  if (holding && load) {
    const ly = HOOK_TOTAL + SLING_HEIGHT;
    ctx.globalAlpha = load.alpha;
    ctx.strokeStyle = '#2b3037';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(0, HOOK_TOTAL - 4); ctx.lineTo(-load.width / 2 + 5, ly);
    ctx.moveTo(0, HOOK_TOTAL - 4); ctx.lineTo(load.width / 2 - 5, ly);
    ctx.stroke();
    drawFloor({x: -load.width / 2, y: ly, width: load.width, height: load.height}, load.style, load.imgIdx);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawJib(jy) {
  const top = jy - 18, bot = jy - 4, x0 = -20, x1 = W + 20, step = 16;
  ctx.fillStyle = 'rgba(0,0,0,.08)';
  ctx.fillRect(x0, bot + 4, x1 - x0, 3);
  // решётка
  ctx.strokeStyle = '#d99a00';
  ctx.lineWidth = 2;
  ctx.beginPath();
  let up = true;
  for (let x = x0; x < x1; x += step) {
    ctx.moveTo(x, up ? bot : top); ctx.lineTo(x + step, up ? top : bot);
    ctx.moveTo(x, top); ctx.lineTo(x, bot);
    up = !up;
  }
  ctx.stroke();
  // верхний и нижний пояс
  const chord = ctx.createLinearGradient(0, top, 0, bot + 4);
  chord.addColorStop(0, '#ffd43b');
  chord.addColorStop(1, '#e6a300');
  ctx.fillStyle = chord;
  ctx.fillRect(x0, top - 2, x1 - x0, 4);
  ctx.fillRect(x0, bot, x1 - x0, 4);
  ctx.strokeStyle = 'rgba(90,60,0,.5)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x0, top - 2, x1 - x0, 4);
  ctx.strokeRect(x0, bot, x1 - x0, 4);
}

function drawCab(x, jy) {
  ctx.fillStyle = '#f2b400';
  roundRect(x - 16, jy, 32, 26, 4);
  ctx.fill();
  ctx.strokeStyle = 'rgba(80,55,0,.6)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = '#9fd8f0';
  roundRect(x - 11, jy + 5, 22, 11, 2);
  ctx.fill();
}

function drawHookBlock() {
  // жёлто-чёрная обойма крюка
  ctx.save();
  roundRect(-10, 0, 20, HOOK_BLOCK_H, 3);
  ctx.clip();
  ctx.fillStyle = '#f5b800';
  ctx.fillRect(-10, 0, 20, HOOK_BLOCK_H);
  ctx.fillStyle = '#22252b';
  for (let i = -3; i < 5; i++) {
    const sx = i * 9;
    ctx.beginPath();
    ctx.moveTo(sx, 0); ctx.lineTo(sx + 4.5, 0);
    ctx.lineTo(sx + 4.5 - HOOK_BLOCK_H, HOOK_BLOCK_H); ctx.lineTo(sx - HOOK_BLOCK_H, HOOK_BLOCK_H);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle = '#22252b';
  ctx.lineWidth = 1.2;
  roundRect(-10, 0, 20, HOOK_BLOCK_H, 3);
  ctx.stroke();
  ctx.fillStyle = '#5a6069';
  ctx.beginPath(); ctx.arc(0, 5, 3, 0, Math.PI * 2); ctx.fill();
  // сам крюк
  ctx.strokeStyle = '#4b515a';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, HOOK_BLOCK_H);
  ctx.lineTo(0, HOOK_BLOCK_H + 7);
  ctx.arc(-4.5, HOOK_BLOCK_H + 7, 4.5, 0, Math.PI * 0.85);
  ctx.stroke();
  ctx.lineCap = 'butt';
}

// ---------- ДОМИКИ (фундамент + 6 видов этажей) ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function vgrad(y0, y1, stops) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c));
  return g;
}
function brickPattern(x, y, w, h, mortar, rows) {
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  const ch = h / rows, bw = w / 5;
  ctx.strokeStyle = mortar;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let r = 0; r < rows; r++) {
    const yy = y + r * ch;
    ctx.moveTo(x, yy); ctx.lineTo(x + w, yy);
    const off = r % 2 ? bw / 2 : 0;
    for (let bx = x - bw + off; bx < x + w; bx += bw) { ctx.moveTo(bx, yy); ctx.lineTo(bx, yy + ch); }
  }
  ctx.stroke();
  ctx.restore();
}
function cornice(x, y, w, h, color) {
  const t = Math.max(3, Math.min(7, h * 0.08));
  ctx.fillStyle = color;
  roundRect(x - 2, y, w + 4, t, 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.12)';
  ctx.fillRect(x, y + t, w, 1.5);
}
function sideShade(x, y, w, h) {
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, 'rgba(255,255,255,.10)');
  g.addColorStop(0.65, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,.16)');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
}
function drawWindow(x, y, w, h, o = {}) {
  const frame = o.frame || '#fff8ec';
  ctx.fillStyle = frame;
  roundRect(x - 2, y - 2, w + 4, h + 4, 2);
  ctx.fill();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, o.glassTop || '#bfe8fa');
  g.addColorStop(1, o.glassBottom || '#4b93c4');
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  if (o.curtain) {
    ctx.fillStyle = o.curtain;
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x + w * 0.38, y);
    ctx.quadraticCurveTo(x + w * 0.12, y + h * 0.5, x, y + h * 0.75);
    ctx.closePath(); ctx.fill();
  }
  ctx.strokeStyle = frame;
  ctx.lineWidth = Math.max(1, w * 0.08);
  ctx.beginPath();
  ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h);
  if (o.cross !== false) { ctx.moveTo(x, y + h * 0.45); ctx.lineTo(x + w, y + h * 0.45); }
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.4)';
  ctx.fillRect(x + w * 0.1, y + h * 0.08, w * 0.16, h * 0.3);
}
function drawShutters(x, y, w, h, color) {
  const sw = w * 0.34;
  [x - sw - 2, x + w + 2].forEach(sx => {
    ctx.fillStyle = color;
    ctx.fillRect(sx, y - 2, sw, h + 4);
    ctx.strokeStyle = 'rgba(0,0,0,.25)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    for (let i = 1; i < 5; i++) { const ly = y - 2 + (h + 4) * i / 5; ctx.moveTo(sx, ly); ctx.lineTo(sx + sw, ly); }
    ctx.stroke();
  });
}
function drawFlowerBox(x, y, w) {
  ctx.fillStyle = '#8a5a2b';
  ctx.fillRect(x, y, w, 5);
  const colors = ['#e84a5f', '#ff8fb1', '#ffd166'];
  for (let i = 0; i < 5; i++) {
    const fx = x + w * (i + 0.5) / 5;
    ctx.fillStyle = '#4c9a2a';
    ctx.beginPath(); ctx.arc(fx, y - 1, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = colors[i % 3];
    ctx.beginPath(); ctx.arc(fx, y - 3, 1.8, 0, Math.PI * 2); ctx.fill();
  }
}
function drawDoor(x, y, w, h, color) {
  ctx.fillStyle = '#f5ecd9';
  roundRect(x - 2, y - 2, w + 4, h + 2, 3);
  ctx.fill();
  ctx.fillStyle = color;
  roundRect(x, y, w, h, 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + w * 0.18, y + h * 0.12, w * 0.64, h * 0.3);
  ctx.strokeRect(x + w * 0.18, y + h * 0.52, w * 0.64, h * 0.36);
  ctx.fillStyle = '#f3c34a';
  ctx.beginPath(); ctx.arc(x + w * 0.8, y + h * 0.55, 1.6, 0, Math.PI * 2); ctx.fill();
}
function archPath(x, y, w, h) {
  const ah = w * 0.6;
  ctx.beginPath();
  ctx.moveTo(x, y + h);
  ctx.lineTo(x, y + ah);
  ctx.quadraticCurveTo(x, y + ah * 0.2, x + w / 2, y);
  ctx.quadraticCurveTo(x + w, y + ah * 0.2, x + w, y + ah);
  ctx.lineTo(x + w, y + h);
  ctx.closePath();
}

const FLOOR_PAINTERS = {
  // Фундамент: бетон, каменная кладка, ступеньки у входа
  foundation(x, y, w, h) {
    ctx.fillStyle = vgrad(y, y + h, ['#b9c0c8', '#8f98a2', '#6f7883']);
    roundRect(x, y, w, h, 3); ctx.fill();
    ctx.save(); roundRect(x, y, w, h, 3); ctx.clip();
    ctx.strokeStyle = 'rgba(35,40,48,.35)';
    ctx.lineWidth = 1;
    const rows = 3, rh = h / rows, pat = [0.18, 0.24, 0.15, 0.21, 0.2];
    ctx.beginPath();
    for (let r = 0; r < rows; r++) {
      const yy = y + r * rh;
      ctx.moveTo(x, yy); ctx.lineTo(x + w, yy);
      let sx = x + (r % 2 ? w * 0.1 : 0), k = r;
      while (sx < x + w) { ctx.moveTo(sx, yy); ctx.lineTo(sx, yy + rh); sx += w * pat[k % pat.length]; k++; }
    }
    ctx.stroke();
    ctx.restore();
    for (let i = 0; i < 3; i++) {
      const sw = w * 0.34 - i * w * 0.07, sh = h * 0.16;
      ctx.fillStyle = i % 2 ? '#cfd4da' : '#dde1e5';
      ctx.fillRect(x + w / 2 - sw / 2, y + h - (i + 1) * sh, sw, sh);
    }
    ctx.fillStyle = '#3a4048';
    [0.18, 0.82].forEach(f => { roundRect(x + w * f - 7, y + h * 0.42, 14, 7, 2); ctx.fill(); });
    ctx.fillStyle = '#e3e6ea';
    roundRect(x - 3, y - 3, w + 6, 7, 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.12)';
    ctx.fillRect(x - 3, y + 3, w + 6, 1.5);
  },
  // Кирпичный дом, 4 окна
  brick(x, y, w, h) {
    ctx.fillStyle = vgrad(y, y + h, ['#d98a5a', '#c1693f', '#9c4f2e']);
    ctx.fillRect(x, y, w, h);
    brickPattern(x, y, w, h, 'rgba(255,235,210,.45)', 9);
    cornice(x, y, w, h, '#f3ece0');
    const ww = w * 0.24, wh = h * 0.26;
    [[0.3, 0.2], [0.7, 0.2], [0.3, 0.6], [0.7, 0.6]].forEach(([fx, fy]) =>
      drawWindow(x + w * fx - ww / 2, y + h * fy, ww, wh, {frame: '#f6efe2'}));
  },
  // Жёлтая штукатурка, зелёные ставни, цветы, дверь
  plaster(x, y, w, h) {
    ctx.fillStyle = vgrad(y, y + h, ['#f7c95b', '#eeac3e', '#d8902b']);
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = 'rgba(160,90,20,.25)';
    ctx.fillRect(x, y + h * 0.5, w, 1.5);
    cornice(x, y, w, h, '#fff1d2');
    const ww = w * 0.17, wh = h * 0.26;
    [0.27, 0.73].forEach(fx => {
      const wx = x + w * fx - ww / 2, wy = y + h * 0.14;
      drawShutters(wx, wy, ww, wh, '#5f9a3a');
      drawWindow(wx, wy, ww, wh, {frame: '#fff6e0', curtain: 'rgba(255,255,255,.7)'});
    });
    drawFlowerBox(x + w * 0.27 - ww / 2 - 2, y + h * 0.14 + wh + 5, ww + 4);
    const wx2 = x + w * 0.27 - ww / 2, wy2 = y + h * 0.6;
    drawShutters(wx2, wy2, ww, wh * 0.95, '#5f9a3a');
    drawWindow(wx2, wy2, ww, wh * 0.95, {frame: '#fff6e0'});
    const dw = w * 0.19, dh = h * 0.38;
    drawDoor(x + w * 0.73 - dw / 2, y + h - dh - 2, dw, dh, '#a3431f');
  },
  // Деревянный сруб из брёвен
  wood(x, y, w, h) {
    const n = 6, lh = h / n;
    for (let i = 0; i < n; i++) {
      const ly = y + i * lh;
      ctx.fillStyle = vgrad(ly, ly + lh, ['#dcae76', '#b97a3f', '#8e5528']);
      roundRect(x, ly + 0.5, w, lh - 1, lh / 2);
      ctx.fill();
      [x + lh * 0.5, x + w - lh * 0.5].forEach(ex => {
        ctx.fillStyle = '#e8c38f';
        ctx.beginPath(); ctx.arc(ex, ly + lh / 2, lh * 0.42, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(120,70,30,.6)';
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.arc(ex, ly + lh / 2, lh * 0.22, 0, Math.PI * 2); ctx.stroke();
      });
    }
    const ww = w * 0.3, wh = h * 0.36, wx = x + w * 0.42 - ww / 2, wy = y + h * 0.26;
    ctx.fillStyle = '#6b3d1b';
    ctx.fillRect(wx - 4, wy - 4, ww + 8, wh + 8);
    drawWindow(wx, wy, ww, wh, {frame: '#fff4e0', curtain: 'rgba(214,120,160,.75)'});
    const px = x + w * 0.76, py = y + h * 0.62;
    ctx.fillStyle = '#b5562f'; ctx.fillRect(px - 5, py, 10, 8);
    ctx.fillStyle = '#4c9a2a'; ctx.beginPath(); ctx.arc(px, py - 3, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e84a5f'; ctx.beginPath(); ctx.arc(px + 2, py - 5, 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6b3d1b';
    ctx.fillRect(x, y, w, 3);
  },
  // Красный кирпич с большим круглым окном
  round(x, y, w, h) {
    ctx.fillStyle = vgrad(y, y + h, ['#bf5a3f', '#a4472f', '#823524']);
    ctx.fillRect(x, y, w, h);
    brickPattern(x, y, w, h, 'rgba(255,220,200,.35)', 10);
    cornice(x, y, w, h, '#f3ece0');
    const r = Math.min(w, h) * 0.3, cx = x + w / 2, cy = y + h * 0.54;
    ctx.fillStyle = '#f3ece0';
    ctx.beginPath(); ctx.arc(cx, cy, r + 5, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
    g.addColorStop(0, '#cdeefb'); g.addColorStop(1, '#3f86b8');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#f3ece0';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
    ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
    ctx.stroke();
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.45, 0, Math.PI * 2); ctx.stroke();
  },
  // Современная панелька с балкончиками
  panel(x, y, w, h) {
    ctx.fillStyle = vgrad(y, y + h, ['#a9c1d4', '#86a2ba', '#6a869f']);
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y + h * 0.5); ctx.lineTo(x + w, y + h * 0.5);
    [0.34, 0.67].forEach(f => { ctx.moveTo(x + w * f, y); ctx.lineTo(x + w * f, y + h); });
    ctx.stroke();
    cornice(x, y, w, h, '#e7eef4');
    const ww = w * 0.2, wh = h * 0.24;
    [0.17, 0.5, 0.83].forEach(fx => [0.14, 0.6].forEach(fy => {
      const wx = x + w * fx - ww / 2, wy = y + h * fy;
      drawWindow(wx, wy, ww, wh, {frame: '#eef4f8', glassTop: '#d7f0fb', glassBottom: '#5a8fb3', cross: false});
      ctx.strokeStyle = '#eef4f8';
      ctx.lineWidth = 1.2;
      ctx.strokeRect(wx - 3, wy + wh + 2, ww + 6, 5);
    }));
  },
  // Узбекский стиль: песочный камень, голубые изразцы, арочные окна
  arch(x, y, w, h) {
    ctx.fillStyle = vgrad(y, y + h, ['#f2dfb6', '#e3c893', '#c8a86c']);
    ctx.fillRect(x, y, w, h);
    const bh = h * 0.13;
    ctx.fillStyle = '#1d7fa8';
    ctx.fillRect(x, y, w, bh);
    ctx.fillStyle = '#8fdcef';
    const n = Math.max(4, Math.round(w / 12)), dw = w / n;
    for (let i = 0; i < n; i++) {
      const dx = x + dw * (i + 0.5), dy = y + bh / 2;
      ctx.beginPath();
      ctx.moveTo(dx, dy - bh * 0.35); ctx.lineTo(dx + dw * 0.3, dy);
      ctx.lineTo(dx, dy + bh * 0.35); ctx.lineTo(dx - dw * 0.3, dy);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#f6ead0';
    ctx.fillRect(x, y + bh, w, 2);
    const ww = w * 0.22, wh = h * 0.52;
    [0.28, 0.72].forEach(fx => {
      const wx = x + w * fx - ww / 2, wy = y + h * 0.3;
      ctx.fillStyle = '#c99a3e';
      archPath(wx - 3, wy - 3, ww + 6, wh + 5); ctx.fill();
      const g = ctx.createLinearGradient(0, wy, 0, wy + wh);
      g.addColorStop(0, '#3a78a8'); g.addColorStop(1, '#16395e');
      ctx.fillStyle = g;
      archPath(wx, wy, ww, wh); ctx.fill();
      ctx.strokeStyle = 'rgba(255,230,160,.8)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(wx + ww / 2, wy + ww * 0.3); ctx.lineTo(wx + ww / 2, wy + wh); ctx.stroke();
    });
    ctx.fillStyle = 'rgba(120,85,40,.25)';
    ctx.fillRect(x, y + h * 0.92, w, h * 0.08);
  },
};

function drawFloor(b, style, imgIdx) {
  if (style === 'img') {
    const img = floorImgObjs[imgIdx];
    if (img && img.ready) { drawBlockImage(b, img); return; }
    style = 'brick';
  }
  const paint = FLOOR_PAINTERS[style] || FLOOR_PAINTERS.brick;
  ctx.fillStyle = 'rgba(20,15,10,.22)';
  ctx.fillRect(b.x + 3, b.y + b.height - 2, b.width - 6, 4);
  paint(b.x, b.y, b.width, b.height);
  sideShade(b.x, b.y, b.width, b.height);
  ctx.strokeStyle = 'rgba(40,25,10,.35)';
  ctx.lineWidth = 1.2;
  roundRect(b.x, b.y, b.width, b.height, 3);
  ctx.stroke();
}

// Своя картинка этажа — вписывается без искажений (как object-fit:cover)
function drawBlockImage(b, img) {
  ctx.save();
  roundRect(b.x, b.y, b.width, b.height, 3);
  ctx.clip();
  const ir = (img.naturalWidth || 1) / (img.naturalHeight || 1);
  const br = b.width / b.height;
  let dw, dh, dx, dy;
  if (ir > br) { dh = b.height; dw = dh * ir; dx = b.x - (dw - b.width) / 2; dy = b.y; }
  else { dw = b.width; dh = dw / ir; dx = b.x; dy = b.y - (dh - b.height) / 2; }
  ctx.drawImage(img, dx, dy, dw, dh);
  ctx.restore();
}

// ---------- КОНЕЦ ИГРЫ ----------
function gameOver(win) {
  if (finished) return;
  finished = true;
  playing = false;
  isDropping = true;
  const btn = document.getElementById('build-btn');
  if (btn) btn.disabled = true;
  if (earned > 0) haptic('success');

  const accuracy = totalAttempts > 0 ? (accSum / totalAttempts) * 100 : 0;
  user.balance += earned;
  user.total_games += 1;
  user.total_floors += floors;
  user.total_earned += earned;
  user.best_height = Math.max(user.best_height, floors);
  user.best_accuracy = Math.max(user.best_accuracy, accuracy);
  user.best_combo = Math.max(user.best_combo, maxCombo);

  showGameOverModal(win, accuracy);
  saveGame(accuracy);
}

function showGameOverModal(win, accuracy) {
  const has = earned > 0;
  document.getElementById('go-icon').innerText = win ? '🏆' : (has ? '🎉' : '😔');
  document.getElementById('go-sub').innerText = has ? 'Tabriklaymiz!' : 'Afsus...';
  document.getElementById('go-title').innerText = win ? 'Shahar qurildi!' : (has ? 'Siz yutdingiz' : 'Bu safar omad kelmadi');
  document.getElementById('go-stats').innerText = `🏢 ${floors} qavat  ·  🎯 ${Math.round(accuracy)}%  ·  🔥 ${maxCombo} ketma-ket`;
  const amountEl = document.getElementById('go-amount-value');
  amountEl.innerText = '0';
  setTimeout(() => {
    document.getElementById('game-over').classList.add('show');
    countUp(amountEl, earned, 900);
  }, 250);
}

function countUp(el, target, ms) {
  const start = performance.now();
  function step(t) {
    const k = Math.min(1, (t - start) / ms);
    const e = 1 - Math.pow(1 - k, 3);
    el.innerText = formatNum(Math.round(target * e));
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

async function saveGame(accuracy) {
  try {
    const res = await fetch(`${API_URL}/api/save_game`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        init_data: initData,
        city: currentCity.name,
        floors: floors,
        accuracy: accuracy,
        combo: maxCombo,
        earned: earned
      })
    });
    const data = await res.json();
    if (data.user) user = data.user;
  } catch (e) {
    console.error('Save error:', e);
  }
}

function restartGame() {
  startGame(currentCityIndex);
}

function exitGame() {
  gameActive = false;
  playing = false;
  cancelAnimationFrame(animId);
  render();
  showScreen('main');
}

function openBonus() {
  if (user.bonus_claimed) {
    toast("Bonus allaqachon olingan");
    return;
  }
  showScreen('sponsors');
}

function renderSponsors() {
  const list = document.getElementById('sponsors-list');
  if (!list) return;

  list.innerHTML = channels.map((ch, i) => `
    <div class="sponsor-card" onclick="window.open('${ch.url}', '_blank')">
      <div class="sp-icon">📢</div>
      <div class="sp-info">
        <div class="sp-name">${ch.name}</div>
      </div>
      <div class="sp-action">Obuna</div>
    </div>
  `).join('');
}

async function checkSubscription() {
  try {
    const res = await fetch(`${API_URL}/api/check_subscription`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({init_data: initData})
    });
    const data = await res.json();

    if (data.subscribed) {
      user.balance += BONUS_AMOUNT;
      user.bonus_claimed = true;
      toast(`✅ Bonus qoʻshildi: +${BONUS_AMOUNT} tanga`);
      render();
      showScreen('profile');
    } else {
      toast("❌ Obuna bo'ling: " + (data.not_subscribed || []).join(', '));
    }
  } catch (e) {
    toast('❌ Tarmoq xatosi');
  }
}
